<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pista de baile libre</title>
<script>
/* ════════════════════════════════════════════════════════════════
   PISTA LIBRE (propuesta) — igual que baile-regalos.html, pero los bailarines se mueven
   libres por toda la pista (sin casillas ni filas): caminan, corren, hacen moonwalk y
   ruedas, se apoyan y rebotan en los bordes de la pantalla, patean los regalos del piso,
   les rebotan regalos en la cabeza y chocan las manos entre ellos.
   ────────────────────────────────────────────────────────────────
   PISTA DE BAILE + REGALOS — los bailarines de baile.html y los regalos que entran
   volando en parábola como en Rosas 7 (en 2D, del tamaño de los bailarines). Cada regalo
   vuela hacia el bailarín de quien lo mandó y se apila en el piso detrás de ellos.
   Los regalos entran como fichas 3D (como Rosas 7), se achican mientras viajan hacia la pista
   (que se ve lejos) y al asentarse en la pila se vuelven 2D. ?ficha=siempre = se quedan 3D
   inclinadas como en Rosas 7 · ?ficha=0 = siempre 2D.
   Opciones extra: ?regalo=1 tamaño de los regalos · ?maxregalos=60 · ?vida=90 s en la pila · ?piso=1880
   (Rosas 7 queda igual; este es un overlay aparte. Usar uno u otro, no los dos.)

   CÓMO SE JUEGA
   · ❤️ QUIÉREME → tu bailarín queda FIJO por 15 minutos (con color y tu nombre):
                  si se queda sin energía se sienta a descansar, pero no se va.
                  Pasados los 15 min vuelve a ser invitado (otro Quiéreme renueva).
   · 👆 TAPS    → energía para tu bailarín. Si no tienes bailarín, entras como
                  INVITADO gris (si hay lugar); sin energía el invitado se va.
   · 🎁 REGALOS → siempre entras a la pista (aunque esté llena), mucha energía
                  (1 moneda = 6 s) y NIVEL según las monedas del DÍA (como el top de monedas;
                  si tu bailarín se va y vuelve ese día, vuelve con el mismo nivel):
                  Nv2 10 bandana · Nv3 50 lentes · Nv4 200 sombrero · Nv5 1000 capa
                  · Nv6 2500 cadena de oro con púa · Nv7 5000 fuego en los pies
                  · Nv8 10000 aura · Nv9 20000 cuerpo dorado y aureola
                  · Nv10 50000 LEYENDA (arcoíris, aura de colores y foco propio).
                  El que más monedas dio está al centro con CORONA.
                  Un regalo de 500+ arma una FIESTA (luces y confeti 15 s).
   · 💃🕺🎸🔥🤸👏 o "baila" en el chat → paso especial (+2 s).

   ENLACE (fuente de navegador en OBS, 1080×1920):
     baile.html                   → normal (TikFinity ws://localhost:21213)
     ?test=1     botones para probar sin live (o teclas 1-6, Q, E, L, F, C)
     ?demo=1     simula un live solo
     ?piso=1500  altura del piso en el lienzo 1920 (también puedes mover la fuente en OBS)
     ?escala=1   tamaño de los bailarines
     ?max=12     máximo de bailarines a la vez
     ?bpm=100    velocidad del baile (también !bpm 120 en el chat, solo dueños)
     ?fan=Heart Me  nombre del regalo que da bailarín fijo (por defecto Quiéreme / Heart Me)
     ?invitados=0  sin invitados gratis · ?fotos=1 foto de perfil como cabeza · ?fijo=15 minutos de bailarín fijo por Quiéreme
     ?luces=0    sin piso de luces · ?ayuda=1 muestra un cartel con las reglas
     ?fps=30     limita cuadros por segundo (por defecto sigue a OBS)
   COMANDOS (dueños): !bpm N · !fiesta · !limpiar
   ════════════════════════════════════════════════════════════════ */
const Q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; };
const CFG = {
  wsUrl: 'ws://localhost:21213/',
  owners: ['rodrigovelizguitar'],
  floorY: num('piso', 1880),        // en la base del live
  scale: num('escala', 1),
  max: Math.max(1, Math.min(30, num('max', 12))),
  bpm: num('bpm', 100),
  guests: Q.get('invitados') !== '0',
  photos: Q.get('fotos') === '1',
  fixedMin: num('fijo', 15),
  lights: Q.get('luces') !== '0',
  help: Q.get('ayuda') === '1',
  fps: num('fps', 0),
  energyMax: 7200,       // máximo 2 horas de baile (pedido de Rodrigo: una galaxia no debe durar solo 2 min)
  secPerCoin: 8,         // 1 moneda = 8 s
  spawnMinSec: 25,       // al entrar siempre tienes al menos 25 s
  // Barra de energía = tanque de cada bailarín. Siempre entra LLENA; lo que cambia es el tamaño del tanque
  // (cuánto dura llena): invitado 30 s, donador al menos 60 s y crece con regalos grandes (máx 2 h).
  guestCap: num('tanque', 30), giftCapMin: 60,
  tapPct: num('tap', 0.2),     // cada tap tap (evento de likes) llena 20 % de la barra (tope 20 % de 60 s en barras grandes)
  tapGap: 0.6,                 // un mismo usuario suma como máximo cada 0,6 s (TikTok manda los taps en ráfagas)
  coinPct: 0.25,               // regalo de menos de 10 monedas: 25 % por moneda · 10 monedas o más: barra llena
  vipCoins: num('vip', 1000), vipExtra: 8,   // 1000+ monedas en el día = bailarín PERMANENTE con lugar extra (hasta 8 extra)
  fest: (Q.get('fest') || '').split(',').map(x => x.trim().toLowerCase()).filter(Boolean),   // regalos LIVE Fest (nombre o id) = doble
  fanGift: Q.get('fan') || '', fanGiftId: 7934,
  emojiSec: 2, emojiCooldown: 4,
  tiredSec: 8,
  levels: [0, 10, 50, 200, 1000, 2500, 5000, 10000, 20000, 50000],
  fiestaSec: 15, fiestaCoins: 500,
};
</script>

  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; pointer-events: none; }

<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script>
'use strict';
/* ── Lienzo: solo una franja alrededor del piso (más liviano que 1080×1920) ── */
const SC = CFG.scale;
const BAND_UP = Math.round(640 * SC), BAND_DN = Math.round(150 * SC);
const BAND_TOP = 0;                            // lienzo completo: los regalos vuelan desde abajo de la pantalla
const W = 1080, BH = 1920;
const FLOOR = CFG.floorY - BAND_TOP;          // piso dentro del lienzo
const cv = document.getElementById('cv');
const stage = document.getElementById('stage');
cv.width = W; cv.height = BH; cv.style.top = BAND_TOP + 'px';
const ctx = cv.getContext('2d');
function fit() { stage.style.transform = `scale(${innerWidth / 1080})`; }
addEventListener('resize', fit); fit();

const TAU = Math.PI * 2, R = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
const now = () => performance.now() / 1000;
const OWNERS = CFG.owners.map(s => s.toLowerCase());

/* ── Estado ────────────────────────────────────────────── */
const dancers = [];                 // bailarines en pista
const byId = new Map();
const parts = [];                   // partículas (confeti, chispas, polvo)
const floats = [];                  // textos flotantes
let fiestaUntil = 0, beat0 = now(), bpm = CFG.bpm, lastRank = 0, dirty = true;
const MAXP = 240;

/* Bailarines fijos (Quiéreme): 15 minutos cada uno, se guarda por si OBS recarga */
const FKEY = 'bailelib_fijos_v2';
let FANS = {}; try { FANS = JSON.parse(localStorage.getItem(FKEY) || '{}') || {}; } catch (e) {}
if (Q.has('test') || Q.has('demo')) FANS = {};
function saveFans() { if (Q.has('test') || Q.has('demo')) return; const n = Date.now(); for (const k in FANS) if (FANS[k] < n) delete FANS[k];
  try { localStorage.setItem(FKEY, JSON.stringify(FANS)); } catch (e) {} }
/* Monedas del DÍA por persona (como el top de monedas del ranking): el día empieza a las 3:00 y nunca
   cambia en medio de un live (solo tras 60 min sin actividad). Si un bailarín se va y vuelve ese día,
   vuelve con el mismo nivel. */
const DKEY = 'bailelib_dia_v1', DAY_START_H = 0, DAY_GAP_MIN = 60;   // el día cambia a medianoche (antes 3:00); un live que cruza la medianoche no se corta
const dayKey = t => { const d = new Date(t - DAY_START_H * 3600e3); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
let DAY = { day: dayKey(Date.now()), act: 0, coins: {}, v: 2 };
try { const s = JSON.parse(localStorage.getItem(DKEY) || 'null'); if (s && s.coins && !Q.has('test') && !Q.has('demo')) DAY = s; } catch (e) {}
if (DAY.v !== 2 && DAY.day !== dayKey(Date.now())) DAY = { day: dayKey(Date.now()), act: 0, coins: {}, v: 2 };   // datos con el corte viejo de las 3:00: si ya es otro día, empezar de cero
DAY.v = 2;
function rollDay() { const t = Date.now(); if (!(DAY.act && t - DAY.act <= DAY_GAP_MIN * 60e3) && DAY.day !== dayKey(t)) DAY = { day: dayKey(t), act: 0, coins: {}, v: 2 }; DAY.act = t; }
function saveDay() { if (Q.has('test') || Q.has('demo')) return; try { localStorage.setItem(DKEY, JSON.stringify(DAY)); } catch (e) {} }
const isFan = uid => (FANS[uid] || 0) > Date.now();
const isVip = uid => (DAY.coins[uid] || 0) >= CFG.vipCoins;   // 1000+ monedas hoy: baila siempre y no lo sacan
const isFanGift = (name, id) => CFG.fanGift ? String(name || '').toLowerCase() === CFG.fanGift.toLowerCase()
  : (/heart\s*me|qui[eé]reme/i.test(name || '') || +id === CFG.fanGiftId);
function hueOf(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; return (h >>> 0) % 360; }
function levelOf(coins) { let l = 1; CFG.levels.forEach((c, i) => { if (coins >= c) l = i + 1; }); return l; }
const beats = t => (t - beat0) * bpm / 60;
const inFiesta = t => t < fiestaUntil;

/* ════════════════ POSES Y PASOS ════════════════
   Brazos: ángulos absolutos (0 = abajo, +π/2 = derecha de la pantalla, π = arriba).
   Piernas: se dan los PIES (lfx/rfx = posición en el piso, lfy/rfy = cuánto se levantan)
   y las rodillas se calculan solas (IK), así los pies no patinan.
   air = todo el cuerpo en el aire · cr = agacharse · bx = mover la cadera.        */
const H0_SIT = 4.6 - 0.45;   // cadera casi en el piso (H0 = 4.6)
const KEYS = ['air', 'cr', 'bx', 't', 'hd', 'la1', 'la2', 'ra1', 'ra2', 'lfx', 'lfy', 'rfx', 'rfy', 'rot', 'sx'];
const BASE = { air: 0, cr: 0.15, bx: 0, t: 0, hd: 0, la1: -0.2, la2: -0.1, ra1: 0.2, ra2: 0.1, lfx: -0.8, lfy: 0, rfx: 0.8, rfy: 0, rot: 0, sx: 1 };
const P = o => Object.assign({}, BASE, o);
const fr = b => b - Math.floor(b);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const groove = b => { const c = 0.5 + 0.5 * Math.cos(b * TAU); return c * c; };   // 1 justo en el tiempo
const mix = (A, B, h) => { const o = {}; for (const k in A) o[k] = A[k] + (B[k] - A[k]) * h; return o; };
// pasos "marcados": en cada tiempo va rápido a la pose nueva y la sostiene
function hits(b, list, sharp) { const i = Math.floor(b), h = sstep(0, sharp || 0.3, fr(b));
  return mix(list[(i + list.length - 1) % list.length], list[i % list.length], h); }

const DISCO = [{ ra1: 2.45, ra2: 2.6, bx: 0.45, t: -0.14, hd: 0.25, rfx: 1.15, rfy: 0.15 }, { ra1: -0.35, ra2: -0.75, bx: -0.35, t: 0.12, hd: -0.12, rfx: 0.75, rfy: 0 }];
const ROBOT = [{ la1: -1.57, la2: 3.14, ra1: 1.57, ra2: 0, hd: 0.2 }, { la1: -1.57, la2: 0, ra1: 1.57, ra2: 3.14, hd: -0.2 },
  { la1: -0.35, la2: 1.57, ra1: 0.35, ra2: -1.57, hd: 0 }, { la1: -1.57, la2: -1.57, ra1: 1.57, ra2: 1.57, hd: 0.15 }];

const MOVES = {
  // cambio de peso suave (poca energía)
  sway(b) { const w = Math.sin(b * Math.PI);
    return P({ bx: 0.55 * w, t: -0.06 * w, hd: 0.1 * w, cr: 0.25 + 0.15 * Math.abs(w), lfy: 0.22 * Math.max(0, w), rfy: 0.22 * Math.max(0, -w),
      la1: -0.25 + 0.2 * w, la2: -0.15 + 0.3 * w, ra1: 0.25 + 0.2 * w, ra2: 0.15 + 0.3 * w }); },
  // paso lateral con aplausos
  aplauso(b) { const w = Math.sin(b * Math.PI), c = groove(b);
    return P({ bx: 0.6 * w, t: -0.05 * w, hd: 0.12 * w, cr: 0.3 + 0.35 * c, lfy: 0.45 * Math.max(0, w) ** 2, rfy: 0.45 * Math.max(0, -w) ** 2,
      la1: lerp(-1.25, -0.85, c), la2: lerp(1.75, 2.35, c), ra1: lerp(1.25, 0.85, c), ra2: lerp(-1.75, -2.35, c) }); },
  // manos arriba con saltitos
  brazos(b) { const w = Math.sin(b * Math.PI), c = groove(b);
    return P({ bx: 0.3 * w, t: 0.06 * w, cr: 0.2 + 0.5 * c, air: 0.3 * Math.max(0, Math.sin(b * TAU - Math.PI / 2)) * (1 - c),
      la1: -2.55 + 0.3 * w, la2: -2.85 + 0.45 * w, ra1: 2.55 + 0.3 * w, ra2: 2.85 + 0.45 * w }); },
  // disco: señalar arriba / abajo, marcado en cada tiempo
  disco(b) { const h = hits(b, DISCO, 0.28); return P(Object.assign({ la1: -0.85, la2: 0.95, cr: 0.35 + 0.2 * groove(b) }, h)); },
  floss(b) { const s = Math.sin(b * Math.PI), x = Math.sign(s) * Math.abs(s) ** 0.6;
    return P({ bx: -0.55 * x, t: 0.1 * x, hd: -0.1 * x, cr: 0.3, lfx: -0.7, rfx: 0.7,
      la1: 0.75 * x - 0.12, la2: 0.8 * x - 0.1, ra1: 0.75 * x + 0.12, ra2: 0.8 * x + 0.1 }); },
  // running man
  correr(b) { const ph = Math.floor(b) % 2, f = fr(b), lift = Math.sin(f * Math.PI);
    const p = P({ cr: 0.55 - 0.35 * lift, air: 0.12 * lift, t: 0.05 * (ph ? 1 : -1), hd: 0.1 * groove(b) });
    if (ph) { p.lfx = -0.25; p.lfy = 1.8 * lift; p.rfx = 0.9; p.la1 = -0.5 - 0.5 * lift; p.la2 = 1.0 + 0.6 * lift; p.ra1 = 0.3; p.ra2 = 0.1; }
    else { p.rfx = 0.25; p.rfy = 1.8 * lift; p.lfx = -0.9; p.ra1 = 0.5 + 0.5 * lift; p.ra2 = -1.0 - 0.6 * lift; p.la1 = -0.3; p.la2 = -0.1; }
    return p; },
  // guitarra en el aire 🎸 (con headbang en cada tiempo)
  guitarra(b) { const c = groove(b);
    return P({ lfx: -1.3, rfx: 1.3, cr: 0.9 + 0.35 * c, t: -0.15 + 0.08 * Math.sin(b * Math.PI), hd: -0.3 + 0.4 * c,
      la1: -1.85, la2: -2.3, ra1: 0.55, ra2: -1.1 + 0.45 * Math.sin(b * 2 * TAU) }); },
  // cumbia: paso atrás alternado y cadera
  cumbia(b) { const w = Math.sin(b * Math.PI), ph = Math.floor(b) % 2, lift = Math.sin(fr(b) * Math.PI) * 0.55;
    return P({ bx: 0.4 * w, t: -0.08 * w, hd: 0.12 * w, cr: 0.35 + 0.2 * groove(b),
      lfx: ph ? -0.45 : -0.85, lfy: ph ? lift : 0, rfx: ph ? 0.85 : 0.45, rfy: ph ? 0 : lift,
      la1: -0.5 + 0.25 * w, la2: 1.3 + 0.2 * w, ra1: 0.5 + 0.25 * w, ra2: -1.3 + 0.2 * w }); },
  // robot: poses secas en cada tiempo
  robot(b) { const h = hits(b, ROBOT, 0.14); return P(Object.assign({ cr: 0.25 + 0.15 * groove(b) }, h)); },
  caminar(b) { const s = Math.sin(b * Math.PI * 2), f = fr(b), up = Math.sin(f * Math.PI) * 0.6, ph = Math.floor(b) % 2;
    return P({ cr: 0.2, lfx: -0.55, rfx: 0.55, lfy: ph ? up : 0, rfy: ph ? 0 : up, t: 0.04 * s,
      la1: -0.15 - 0.35 * s, la2: -0.1 - 0.4 * s, ra1: 0.15 + 0.35 * s, ra2: 0.1 + 0.4 * s }); },
  // cansado: sentado en el piso, rodillas arriba, brazos apoyados en las rodillas, respirando
  cansado(b) { const s = Math.sin(b * Math.PI * 0.5);
    return P({ lfx: -0.5, rfx: 0.5, cr: H0_SIT, t: 0.03 * s, hd: 0.12 + 0.04 * s,
      la1: -1.02 - 0.04 * s, la2: 0.5, ra1: 1.02 + 0.04 * s, ra2: -0.5 }); },
  // moonwalk: se desliza hacia atrás (se usa mientras viaja; d.face indica hacia dónde mira)
  moonwalk(b) { const ph = Math.floor(b * 2) % 2, f = fr(b * 2), k = Math.sin(f * Math.PI);
    return P({ cr: 0.3, t: -0.06, hd: -0.12, bx: 0.15 * (ph ? 1 : -1), lfx: ph ? -0.75 : -0.45, rfx: ph ? 0.45 : 0.75, lfy: ph ? 0.4 * k : 0, rfy: ph ? 0 : 0.4 * k,
      la1: -0.25, la2: 0.55, ra1: 0.9 + 0.1 * k, ra2: 1.9, }); },
  // deslizar de lado con brazos abiertos
  deslizar(b) { const w = Math.sin(b * Math.PI), c = groove(b);
    return P({ cr: 0.45 + 0.2 * c, bx: 0.25 * w, t: 0.12, hd: 0.15, lfx: -1.6, rfx: 0.5, lfy: 0.1 * c, la1: -1.75, la2: -1.6 + 0.2 * w, ra1: 1.3, ra2: 1.0 }); },
  // trote para cruzar la pista
  trote(b) { const f = fr(b * 2), up = Math.sin(f * Math.PI), ph = Math.floor(b * 2) % 2;
    return P({ cr: 0.35, air: 0.25 * up, t: 0.1, lfx: -0.5, rfx: 0.5, lfy: ph ? 0.9 * up : 0, rfy: ph ? 0 : 0.9 * up,
      la1: ph ? -0.9 : 0.3, la2: ph ? 0.6 : 1.4, ra1: ph ? -0.3 : 0.9, ra2: ph ? -1.4 : -0.6 }); },
  saludo(b) { const s = Math.sin(b * TAU); return P({ ra1: 2.3, ra2: 2.8 + 0.45 * s, hd: 0.1, bx: 0.15 * s, la1: -0.2 }); },
};
// Especiales: duración en tiempos y pose según progreso 0..1 (con impulso antes y aterrizaje después)
const crouchJump = (q, a, b) => q < a ? sstep(0, a, q) : q > b ? 1 - sstep(b, 1, q) : 0;      // agacharse antes / al caer
const airArc = (q, a, b) => q <= a || q >= b ? 0 : Math.sin((q - a) / (b - a) * Math.PI);
const SPECIAL = {
  salto: { len: 2, f(q) { q = clamp(q, 0, 1); const c = crouchJump(q, 0.22, 0.78), j = airArc(q, 0.22, 0.78), s = sstep(0.2, 0.42, q) * (1 - sstep(0.62, 0.8, q));
    return P({ air: 3.2 * j, cr: 0.15 + 1.2 * c, t: 0.15 * c,
      la1: lerp(lerp(-0.2, -0.5, c), -2.4, s), la2: lerp(lerp(-0.1, -0.3, c), -2.55, s), ra1: lerp(lerp(0.2, 0.5, c), 2.4, s), ra2: lerp(lerp(0.1, 0.3, c), 2.55, s),
      lfx: lerp(-0.8, -1.7, s), rfx: lerp(0.8, 1.7, s), lfy: 0.6 * s, rfy: 0.6 * s }); } },
  giro: { len: 2, f(q) { q = clamp(q, 0, 1); const e = ease(q), a = Math.sin(q * Math.PI);
    return P({ sx: Math.cos(e * TAU * 2), air: 0.25 * a, cr: 0.2 + 0.3 * (1 - a),
      la1: lerp(-0.2, -1.55, a), la2: lerp(-0.1, -1.6, a), ra1: lerp(0.2, 1.55, a), ra2: lerp(0.1, 1.6, a), rfx: lerp(0.8, 0.25, a), rfy: 1.6 * a }); } },
  mortal: { len: 3, f(q) { q = clamp(q, 0, 1); const c = crouchJump(q, 0.16, 0.86), j = airArc(q, 0.16, 0.86), r = ease(clamp((q - 0.2) / 0.6, 0, 1)), tuck = Math.sin(r * Math.PI);
    return P({ air: 4.2 * j, cr: 0.15 + 1.3 * c, rot: -r * TAU, lfx: lerp(-0.8, -0.4, tuck), rfx: lerp(0.8, 0.4, tuck), lfy: 2.6 * tuck, rfy: 2.6 * tuck,
      la1: lerp(lerp(-0.2, -0.6, c), -0.4, tuck) - 2.2 * (j > 0 ? (1 - tuck) : 0), la2: lerp(-0.1, 1.0, tuck) - 2.4 * (j > 0 ? (1 - tuck) : 0),

      if (gifts.includes(g) && !g.fade) { g.sleep = false; g.rest = 0; g.hits = 0; g.landed = false; g.vx = d.face * gRand(650, 950); g.vy = -gRand(650, 950); g.av = d.face * gRand(8, 14); g.kicked = null; g.sqv += 4;
        burst(g.x, g.y, 10, g.hue || 40, 'chispa'); } }
    // choque de manos: chispas entre los dos
    if (d.five && t >= d.five.at) { const o = d.five.o; d.five = null; if (!o.leaving) burst((d.x + o.x) / 2, zFloor(d.z) - 175 * SC * zScale(d.z), 16, 50, 'chispa'); }
    // al caminar por encima de un regalo quieto lo empuja un poco
    if (d.z < 0.35) for (const g of gifts) { if (g.thr || g.fade || !g.sleep || g.y < FLOOR - g.r * 1.6 || g.kicked) continue;
      if (Math.abs(g.x - d.x) < g.r * 0.6 + 14 * SC && t - (g.nudge || 0) > 0.6) { g.nudge = t; g.sleep = false; g.rest = 0; g.vx = (Math.sign(g.x - d.x) || 1) * gRand(160, 260); g.vy = -gRand(140, 240); g.av = gRand(-6, 6); } }
  }
}
// regalos que caen sobre una cabeza: rebotan (y el bailarín se marea o lo cabecea)
function headBounces(t) {
  for (const b of gifts) { if (b.thr || b.fade || b.sleep || b.vy < 150 || (b.heads || 0) >= 2) continue;
    for (const d of dancers) { if (d.leaving || d.drop > 0 || d.hy == null || d.z > 0.6) continue;
      const rr = b.r * GC.overlap + d.hr, dx = b.x - d.hx, dy = b.y - d.hy; if (dx * dx + dy * dy > rr * rr || dy > 0) continue;
      b.heads = (b.heads || 0) + 1; b.y = d.hy - rr; b.vy = -Math.max(420, b.vy * 0.75); b.vx += dx * 6 + gRand(-80, 80); b.av += gRand(-10, 10); b.sqv += 3;
      if (!d.special) doSpecial(d, d.lvl >= 3 || R() < 0.5 ? 'salto' : 'mareo', t);
      burst(d.hx, d.hy - d.hr, 8, 55, 'chispa'); break; } }
}

/* ════════════════ BUCLE ════════════════ */
let running = false, lastT = now(), lastSave = 0, lastHelp = -999, lastFrame = 0;
function wake() { dirty = true; if (!running) { running = true; lastT = now(); requestAnimationFrame(frame); } }
function frame() {
  const t = now();
  if (CFG.fps > 0 && t - lastFrame < 1 / CFG.fps - 0.002) { requestAnimationFrame(frame); return; }
  lastFrame = t;
  const dt = Math.min(0.1, t - lastT); lastT = t;
  update(t, dt);
  updateGifts(dt);
  headBounces(t);
  render(t);
  if (t - lastSave > 3) { lastSave = t; save(); }
  const idle = !dancers.length && !parts.length && !floats.length && !inFiesta(t) && !giftsBusy();
  if (idle && !Q.has('demo')) { running = false; render(t); return; }     // nada que animar → se detiene (0% CPU)
  requestAnimationFrame(frame);
}
function update(t, dt) {
  const fiesta = inFiesta(t), b = beats(t);
  if (t - lastRank > 2.5) { lastRank = t; arrange(); }
  for (let i = dancers.length - 1; i >= 0; i--) {
    const d = dancers[i];
    if (d.drop > 0) { d.drop = Math.max(0, d.drop - dt * 2.2); if (!d.drop) { d.land = t; burst(d.x, zFloor(d.z), 10, 30, 'polvo'); } }
    if (d.leaving) { if (t > d.leaving) { d.alpha -= dt * 3; if (d.alpha <= 0) { burst(d.x, FLOOR - 90 * SC, 14, d.hue, 'chispa'); dancers.splice(i, 1); if (byId.get(d.uid) === d) byId.delete(d.uid); lastRank = 0; } } continue; }
    d.alpha = Math.min(1, d.alpha + dt * 4);
    if (!d.guest && !isFan(d.uid)) { d.guest = true; d.tag = null; d.tiredAt = d.energy <= 0 ? t : 0; }   // se acabaron sus 15 min de fijo
    if (isFan(d.uid) || isVip(d.uid)) { if (d.energy < capOf(d)) { if (d.energy <= 0) d.tiredAt = 0; d.energy = capOf(d); } }   // Quiéreme: baila sin cansarse todos sus 15 min
    else if (!fiesta) d.energy = Math.max(0, d.energy - dt);
    // moverse libre por la pista
    const travel = brain(d, t, dt), walking = !!travel;
    // elegir paso
    if (d.energy <= 0) { if (!d.tiredAt) d.tiredAt = t; setMove(d, 'cansado', t); if (d.guest && t - d.tiredAt > CFG.tiredSec) leave(d); continue; }   // los fijos se quedan descansando
    if (walking && d.drop <= 0) { setMove(d, travel, t); continue; }
    if (window.__forceMove) { setMove(d, window.__forceMove, t); continue; }
    if (fiesta) { setMove(d, FIESTA_SEQ[Math.floor(b / 8) % FIESTA_SEQ.length], t); continue; }
    if (d.energy < 12) { setMove(d, 'sway', t); continue; }
    const slot = Math.floor((b + (d.hue % 4)) / 8);                  // cambia de paso cada 8 tiempos
    if (d.beatSlot !== slot || SPEED[d.move] || d.move === 'sway' || d.move === 'cansado' || d.move === 'saludo') {
      const turned = d.beatSlot !== slot && d.beatSlot !== -1; d.beatSlot = slot;
      setMove(d, ROTA[(slot + d.hue) % ROTA.length], t);
      if (turned && !d.special && R() < 0.2 + 0.05 * Math.min(10, d.lvl)) doSpecial(d, pick(AUTO_SP(d.lvl)), t);   // especial solo
    }
  }
  physicsFree(t, dt);
  if (t - (window.__tagT || 0) > 0.2) { window.__tagT = t; tagLanes(); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.age += dt; if (p.age > p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; if (p.type === 'chispa') p.vy += 500 * dt; else if (p.type === 'polvo') { p.vx *= 1 - 4 * dt; p.vy = p.vy * (1 - 5 * dt) - 20 * dt; } else { p.spin += dt * 6; p.x += Math.sin(p.age * 4 + p.hue) * 40 * dt; } }
  if (fiesta && R() < dt * 25) confetti();
  for (let i = floats.length - 1; i >= 0; i--) if (t - floats[i].t0 > floats[i].life) floats.splice(i, 1);
}
function render(t) {
  ctx.clearRect(0, 0, W, BH);
  const b = beats(t), fiesta = inFiesta(t), active = dancers.length > 0;
  if (fiesta) {                                       // luces
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) { const ang = Math.sin(t * 1.3 + i * 2.1) * 0.55, x = 180 + i * 360;
      ctx.save(); ctx.globalAlpha = 0.35 + 0.15 * Math.sin(b * Math.PI); ctx.translate(x, FLOOR - BAND_UP + 20); ctx.rotate(ang);
      ctx.drawImage(tintBeams[i], -130, 0, 260, BAND_UP); ctx.restore(); }
    ctx.globalCompositeOperation = 'source-over';
  }
  drawFloor(t, b, fiesta, active);
  drawGiftPile(t);
  // fila de atrás primero
  const order = dancers.slice().sort((a, c) => (c.z - a.z) || (a.leader - c.leader));
  const info = new Map();
  for (const d of order) info.set(d, drawDancer(d, currentPose(d, t), t));
  // nombres + energía
  for (const d of order) {
    const inf = info.get(d), tag = tagFor(d);
    // carriles fijos: adelante 2 alturas, atrás 2 alturas más arriba (no se mueven con los saltos, así no se pisan)
    if (d.tagT == null) tagLanes();
    d.tagYs = d.tagYs ? d.tagYs + (d.tagT - d.tagYs) * 0.18 : d.tagT; const ty = d.tagYs;
    d.tagY = ty - tag.height;
    ctx.globalAlpha = d.alpha;
    const tx = clamp(d.x, tag.width / 2 + 4, W - tag.width / 2 - 4);   // que el nombre no se salga por los bordes
    ctx.drawImage(tag, Math.round(tx - tag.width / 2), Math.round(ty - tag.height));
    const bw = 84 * inf.sc, e = isFan(d.uid) || isVip(d.uid) ? 1 : clamp(d.energy / capOf(d), 0, 1);   // barra = tanque (celeste si tiene más de 10 min)
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(tx - bw / 2 - 2, ty - 1, bw + 4, 9);
    ctx.fillStyle = d.energy > 600 ? '#5fd8ff' : e > 0.4 ? '#36e07a' : e > 0.12 ? '#ffd54a' : '#ff4b4b'; ctx.fillRect(tx - bw / 2, ty + 1, bw * Math.max(e, d.energy > 0 ? 0.03 : 0), 5);
    ctx.globalAlpha = 1;
  }
  drawGiftFlying(t);
  // partículas
  for (const p of parts) { const a = 1 - p.age / p.life; ctx.globalAlpha = a; ctx.fillStyle = p.type === 'polvo' ? 'rgba(235,225,215,0.8)' : `hsl(${p.hue},95%,62%)`;
    if (p.type === 'confeti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin); ctx.fillRect(-p.sz / 2, -p.sz / 4, p.sz, p.sz / 2); ctx.restore(); }
    else ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); }
  ctx.globalAlpha = 1;
  // textos flotantes
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const f of floats) { const q = (t - f.t0) / f.life;
    const x = f.d ? f.d.x : f.x, y = f.d ? (f.d.tagY != null ? f.d.tagY - 24 * SC : FLOOR - 290 * SC) - q * 70 * SC : f.y;
    const fs = Math.round((f.big >= 1 ? 92 : f.big ? 40 : 32) * SC * (f.big >= 1 ? 1 + 0.08 * Math.sin(b * TAU) : 1));
    ctx.globalAlpha = q < 0.8 ? 1 : (1 - q) / 0.2;
    ctx.font = `900 ${fs}px "Segoe UI", Arial, sans-serif`; ctx.lineWidth = fs / 6; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.strokeText(f.txt, x, y); ctx.fillStyle = f.big >= 1 ? `hsl(${(t * 220) % 360},95%,65%)` : f.col; ctx.fillText(f.txt, x, y); }
  ctx.globalAlpha = 1;
  // cómo jugar: siempre si la pista está vacía, si no 8 s cada minuto
  if (CFG.help) { const show = !active || (t - lastHelp) < 8; if (active && t - lastHelp > 60) lastHelp = t;
    if (show) { const h = helpTag(); ctx.drawImage(h, Math.round(540 - h.width / 2), FLOOR + 48 * Math.min(1, SC)); } }
}

/* ── Los permanentes (1000+ monedas hoy) siempre vuelven a la pista ── */
function bringVips() {
  const t = Date.now(); if (!(DAY.act && t - DAY.act <= DAY_GAP_MIN * 60e3) && DAY.day !== dayKey(t)) return;   // ya es otro día: no traer a los de ayer
  let n = dancers.filter(x => !x.leaving && isVip(x.uid)).length;
  for (const uid in DAY.coins) {
    if (!isVip(uid) || n >= CFG.vipExtra) continue;
    const d = byId.get(uid);
    if (d && !d.leaving) continue;
    const nd = getOrSpawn(uid, (DAY.names && DAY.names[uid]) || uid, '', 3); if (!nd) continue;
    addEnergy(nd, capOf(nd)); n++; wake();
  }
}
setInterval(bringVips, 4000);
/* ── Guardar (si OBS recarga la fuente, la pista sigue) ── */
const SKEY = 'bailelib_pista_v1';
function save() { try { localStorage.setItem(SKEY, JSON.stringify({ at: Date.now(), bpm,
  d: dancers.filter(d => !d.leaving).map(d => ({ uid: d.uid, name: d.name, pic: d.pic, guest: d.guest, coins: d.coins, energy: d.energy, cap: d.cap, x: d.x })) })); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(SKEY) || 'null');
  if (!s || Date.now() - s.at > 3 * 60 * 1000 || Q.has('test') || Q.has('demo')) return;

  for (const o of s.d || []) { const d = makeDancer(o.uid, o.name, o.pic); Object.assign(d, { coins: Math.max(d.coins, o.coins || 0), energy: Math.max(o.energy, 6), cap: o.cap || 0, x: o.x, drop: 0 });
    d.lvl = d.coins ? levelOf(d.coins) : (d.guest ? 0 : 1); dancers.push(d); byId.set(d.uid, d);
    if (d.coins) (DAY.names = DAY.names || {})[d.uid] = d.name; } } catch (e) {} }

/* ── TikFinity ────────────────────────────────────────── */
const combos = new Map(), seen = new Set();
function onGift(d) {
  const uid = (d.uniqueId || d.userId || '').toString(); if (!uid) return;
  const coins = parseInt(d.diamondCount ?? d.gift?.diamond_count ?? 0, 10) || 0; if (!coins) return;
  const cnt = parseInt(d.repeatCount || d.gift?.repeat_count || 1, 10) || 1;
  const key = uid + '|' + (d.giftId ?? d.giftName ?? '?') + '|' + (d.groupId || '');
  // los combos llegan como 1,2,3…: se suma solo lo nuevo para que el bailarín reaccione en vivo
  const prev = combos.get(key); const was = prev ? prev.n : 0;
  const delta = Math.max(0, cnt - was);
  if (d.repeatEnd === false) combos.set(key, { n: cnt, t: Date.now() }); else combos.delete(key);
  if (!delta) return;
  const u2 = uid.toLowerCase();
  onGiftCoins(u2, d.nickname || uid, d.profilePictureUrl || '', coins * delta, d.giftName, d.giftId);
  const who2 = byId.get(u2);
  dropGifts(key, d.giftPictureUrl || d.gift?.giftPictureUrl || '', coins, delta, () => { const x = byId.get(u2); return x ? x.tx : 540; }, who2 ? who2.hue : 350);
}
function onLike(d) {
  const uid = (d.uniqueId || d.userId || '').toString().toLowerCase(); if (!uid) return;
  const n = parseInt(d.likeCount || 1, 10) || 1;
  DAY.act = Date.now();
  let x = byId.get(uid);
  if (x && x.name === x.uid && d.nickname && d.nickname.toLowerCase() !== uid) { x.name = String(d.nickname).slice(0, 13); x.tag = null; (DAY.names = DAY.names || {})[uid] = d.nickname; }
  if (!x) { if (!CFG.guests && !isFan(uid)) return; x = getOrSpawn(uid, d.nickname || uid, d.profilePictureUrl || '', isFan(uid) ? 2 : 1); if (!x) return; addEnergy(x, capOf(x)); x.lastTap = now(); wake(); return; }   // entra con la barra llena
  const tn = now(); if (tn - (x.lastTap || 0) < CFG.tapGap) return; x.lastTap = tn;
  const was = x.energy; addEnergy(x, CFG.tapPct * Math.min(capOf(x), CFG.giftCapMin));
  if (was <= 0 && x.energy > 0) doSpecial(x, 'salto', now());           // se levanta de descansar
  wake();
}
function onChat(d) {
  const uid = (d.uniqueId || d.userId || '').toString().toLowerCase(), txt = (d.comment || '').trim();
  if (txt.startsWith('!') && OWNERS.includes(uid)) {
    const m = txt.toLowerCase().match(/^!bpm\s+(\d{2,3})/); if (m) { const nb = clamp(+m[1], 60, 200); beat0 = now() - beats(now()) * 60 / nb; bpm = nb; return; }
    if (txt.toLowerCase() === '!fiesta') { if (dancers.length) startFiesta(now()); return; }
    if (txt.toLowerCase() === '!reiniciar') { DAY = { day: dayKey(Date.now()), act: Date.now(), coins: {}, v: 2 }; saveDay(); dancers.forEach(x => { x.coins = 0; x.lvl = x.guest ? 0 : 1; x.tag = null; leave(x, true); }); wake(); return; }   // monedas del día a cero
    if (txt.toLowerCase() === '!limpiar') { dancers.forEach(x => leave(x, true)); fiestaUntil = 0; wake(); return; }
  }
  onEmoji(uid, d.nickname || uid, d.profilePictureUrl || '', txt);
}
function handle(ev, d) {
  if (ev === 'gift') onGift(d);
  else if (ev === 'like') onLike(d);
  else if (ev === 'chat') onChat(d);
}
let ws = null, reTimer = null;
function connect() {
  try { ws = new WebSocket(CFG.wsUrl); } catch (e) { return retry(); }
  ws.onopen = () => console.log('[Baile] Conectado a TikFinity');
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } const d = m.data || {};
    if (d.msgId) { const k = m.event + '|' + d.msgId + '|' + (d.uniqueId || '') + '|' + (d.likeCount || '') + '|' + (d.repeatCount || '') + '|' + d.repeatEnd;
      if (seen.has(k)) return; seen.add(k); if (seen.size > 3000) seen.clear(); }
    handle(m.event, d); };
  ws.onerror = () => {}; ws.onclose = retry;
}
function retry() { clearTimeout(reTimer); reTimer = setTimeout(connect, 5000); }
setInterval(() => { const t = Date.now(); for (const [k, v] of combos) if (t - v.t > 30000) combos.delete(k); }, 10000);

/* ── Pruebas sin live ─────────────────────────────────── */
const FAKE = ['Andrea', 'Lokito_23', 'Sumo', 'Luz', 'MarcoElPro', 'Kathy', 'Rolo', 'Vale', 'Pancho', 'Mery', 'Tito', 'Juanca', 'Nico', 'Flor', 'GuitarFan'];
// en pruebas: las imágenes reales de regalos que están en el repo (las mismas del demo de Rosas 7);
// los que no están se dibujan con emoji. En el live se usa la imagen que manda TikTok (giftPictureUrl).
const REPO_IMG = 'https://raw.githubusercontent.com/srdwly/testoverlay/main/img/';
const TEST_IMG = { 99: REPO_IMG + 'sombrero.png', 199: REPO_IMG + 'amplificado.png', 500: REPO_IMG + 'pistola.png', 1000: REPO_IMG + 'galaxia.png' };
for (const [c, e] of [[5, '💖'], [10, '🍩'], [30, '🎸']]) {
  const cc = document.createElement('canvas'); cc.width = cc.height = 112; const x = cc.getContext('2d');
  x.font = '80px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, 56, 60);
  TEST_IMG[c] = cc.toDataURL(); }
const pick = a => a[Math.floor(R() * a.length)];
let testName = '';
function who() { const n = testName || pick(FAKE); return { uniqueId: n.toLowerCase(), nickname: n }; }
function fakeGift(coins, name, count) { const b = { ...who(), giftPictureUrl: TEST_IMG[coins] || '' }; const gid = 'g' + coins;
  if (count > 1) { let c = 0; const iv = setInterval(() => { c++; handle('gift', { ...b, giftName: name, giftId: gid, diamondCount: coins, repeatCount: c, repeatEnd: false, giftType: 1 });
    if (c >= count) { clearInterval(iv); handle('gift', { ...b, giftName: name, giftId: gid, diamondCount: coins, repeatCount: c, repeatEnd: true, giftType: 1 }); } }, 250); }
  else handle('gift', { ...b, giftName: name, giftId: gid, diamondCount: coins, repeatCount: 1, giftType: 2 }); }
const TESTS = [
  ['q', 'Quiéreme ❤️', () => fakeGift(1, 'Heart Me', 1)],
  ['1', 'Rosa (1)', () => fakeGift(1, 'Rose', 1)],
  ['2', '10 rosas', () => fakeGift(1, 'Rose', 10)],
  ['3', 'Corazón (5)', () => fakeGift(5, 'Finger Heart', 1)],
  ['4', 'Sombrero (99)', () => fakeGift(99, 'Hat and Mustache', 1)],
  ['5', 'Regalo 500', () => fakeGift(500, 'Money Gun', 1)],
  ['6', 'Galaxia (1000)', () => fakeGift(1000, 'Galaxy', 1)],
  ['e', 'Emoji 💃', () => handle('chat', { ...who(), comment: pick(['💃', '🕺', '🎸', '🔥', '🤸', '👏', 'baila!']) })],
  ['l', 'Taps 👆', () => handle('like', { ...who(), likeCount: 15 })],
  ['f', '¡Fiesta!', () => { if (!dancers.length) fakeGift(1, 'Rose', 1); setTimeout(() => startFiesta(now()), 50); }],
  ['c', 'Limpiar', () => { dancers.forEach(x => leave(x, true)); fiestaUntil = 0; wake(); }],
];
addEventListener('keydown', e => { const k = e.key.toLowerCase(); const t = TESTS.find(x => x[0] === k); if (t && e.target.tagName !== 'INPUT') t[2](); });
if (Q.get('test') === '1') {
  const box = document.createElement('div'); box.id = 'test';
  const inp = document.createElement('input'); inp.placeholder = 'nombre (opcional)'; inp.oninput = () => testName = inp.value.trim(); box.appendChild(inp);
  for (const [k, label, fn] of TESTS) { const bt = document.createElement('button'); bt.textContent = label + ' [' + k.toUpperCase() + ']'; bt.onclick = fn; box.appendChild(bt); }
  document.body.appendChild(box);
}
function startDemo() {
  setInterval(() => { const r = R();
    if (r < 0.45) handle('like', { ...who(), likeCount: 5 + Math.floor(R() * 40) });
    else if (r < 0.52) fakeGift(1, 'Heart Me', 1);
    else if (r < 0.75) handle('chat', { ...who(), comment: pick(['💃', '🕺', '🎸', '🔥', '🤸', '👏', 'hola', 'baila']) });
    else if (r < 0.97) fakeGift(pick([1, 1, 1, 5, 10, 30]), 'Rose', R() < 0.4 ? 3 + Math.floor(R() * 8) : 1);
    else fakeGift(pick([99, 199, 500, 1000]), 'Big', 1);
  }, 900);
}
window.__baile = { handle, startFiesta, doSpecial: (d, n) => doSpecial(d, n, now()), get dancers() { return dancers; }, get fijos() { return FANS; }, CFG };

/* ── Inicio ───────────────────────────────────────────── */
load();
arrange();
if (Q.get('demo') === '1') startDemo(); else if (Q.get('test') !== '1' || Q.get('ws') === '1') connect();
wake();
</script>
