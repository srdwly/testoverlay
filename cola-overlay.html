<style>

<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n >= 10000 ? (n/1000).toFixed(0) + 'k' : n >= 1000 ? (n/1000).toFixed(1).replace('.0','') + 'k' : String(n);
const now = () => Date.now();
const params = new URLSearchParams(location.search);
const DEMO = params.get('demo') === '1';
const DEBUG = params.get('debug') === '1';          // cola-overlay.html?debug=1 muestra qué llega del chat
if (DEBUG) document.body.classList.add('debug');
function dbg(text, cls = '') {
  if (!DEBUG) return;
  const box = document.getElementById('dbg'), line = document.createElement('div');
  line.className = cls; line.textContent = new Date().toLocaleTimeString() + '  ' + text;
  box.prepend(line); while (box.children.length > 18) box.lastChild.remove();
}
if (DEMO) { document.body.classList.add('demo'); CFG.owners.push('demo_host'); }
const OWNERS = CFG.owners.map(o => o.toLowerCase().replace(/^@/, ''));

/* ── Datos ──────────────────────────────────────────────── */
STYLES.forEach(s => {
  s.items = []; s.list = []; s.bands = []; let band = '';   // items = bandas + canciones (para mostrar); list = solo canciones (para votar); bands = intérprete de cada canción
  s.songs.split('\n').map(x => x.trim()).filter(Boolean).forEach(line => {
    if (/^[-–•]/.test(line)) { const t = line.replace(/^[-–•]\s*/, ''); s.list.push(t); s.bands.push(band); s.items.push({ num: s.list.length, t }); }
    else if (!/:$/.test(line)) { band = line; s.items.push({ band: line }); }
  });
});
const styleBy = k => STYLES.find(s => s.key === k);

/* ── Búsqueda de canciones por nombre ("disco enlace leny", "disco juana") ── */
const norm = t => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-z0-9]+/g, ' ').trim();
const STOP = new Set('de la el los las y a en un una mi tu te me se que por favor porfa porfis plis pls please pon ponme ponga toca tocame toque cancion tema del al o con para lo le su quiero'.split(' '));
const words = t => norm(t).split(' ').filter(Boolean);
const SONGS = [], BANDWORDS = new Set();
STYLES.forEach(st => st.list.forEach((title, i) => {
  const all = words(title), tw = all.filter(w => !STOP.has(w));
  SONGS.push({ style: st.key, num: i + 1, title, band: st.bands[i] || '',
               tn: all.join(' '), tw: tw.length ? tw : all, bw: words(st.bands[i] || '').filter(w => !STOP.has(w)) });
  words(st.bands[i] || '').forEach(w => { if (!STOP.has(w) && w.length >= 3) BANDWORDS.add(w); });
}));
function lev(a, b) {                       // distancia de edición (errores de tipeo)
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return d[b.length];
}
function wordScore(q, w) {
  if (q === w) return 1;
  if (/^\d+$/.test(q) || /^\d+$/.test(w)) return 0;          // números: solo exactos
  if (q.length >= 3 && w.startsWith(q)) return 0.8;           // nombre incompleto: "carta" → "carta", "trata" → "tratando"
  if (q.length >= 4 && w.length >= 4 && lev(q, w) <= (w.length >= 9 ? 2 : 1)) return 0.7;   // "lenny" → "leny"
  return 0;
}
function searchStyle(styleKey, Q) {
  const qj = ' ' + Q.join(' ') + ' ';
  const found = [];
  for (const sg of SONGS) {
    if (sg.style !== styleKey) continue;
    const used = new Set();
    let tHit = 0, bHit = 0;
    const pick = w => {                     // mejor palabra del comentario para w, sin reutilizar palabras
      let m = 0, mi = -1;
      Q.forEach((q, i) => { const sc = wordScore(q, w); if (sc > m || (sc === m && sc > 0 && used.has(mi) && !used.has(i))) { m = sc; mi = i; } });
      if (mi >= 0) used.add(mi);
      return m;
    };
    for (const w of sg.tw) tHit += pick(w);
    for (const w of sg.bw) bHit += pick(w);
    // si nombró OTRA banda de la lista, no es esta canción ("cumbia corali prometí" ≠ Promesa de Ronisch)
    if (Q.some((q, i) => !used.has(i) && BANDWORDS.has(q))) continue;
    const cov = tHit / sg.tw.length, bcov = sg.bw.length ? bHit / sg.bw.length : 0;
    const unmatched = Q.length - used.size;
    if (!(cov >= 0.5 || (cov > 0 && bcov >= 0.5))) continue;
    if (unmatched > Math.max(1, Math.floor(Q.length / 3))) continue;
    let score = cov * 2 + bcov - unmatched * 0.6;
    if (qj.includes(' ' + sg.tn + ' ')) score += 0.4 + 0.2 * sg.tn.split(' ').length;   // nombre exacto
    found.push({ sg, score });
  }
  found.sort((a, b) => b.score - a.score);
  if (!found.length) return { type: 'none' };
  const top = found.filter(f => f.score >= found[0].score - 0.15);
  if (top.length === 1) return { type: 'ok', sg: top[0].sg };
  if (top.every(f => f.sg.tn === top[0].sg.tn))                          // mismo nombre, distinto intérprete
    return { type: 'amb', style: styleKey, title: top[0].sg.title, bands: top.map(f => f.sg.band) };
  return { type: 'vague', titles: top.slice(0, 3).map(f => f.sg.title) };
}
const refOf = sg => ({ style: sg.style, num: sg.num, title: sg.title, band: sg.band });
// Devuelve: {type:'ok', ref} | {type:'amb', …} | {type:'none'|'vague'} | null (no es pedido)
function resolveRequest(text) {
  const byNum = parseRef(text);
  if (byNum) return { type: 'ok', ref: byNum };
  const W = words(text);
  if (W.length < 2 || !styleBy(W[0])) return null;                        // debe empezar con "disco"/"cumbia"
  const Q = W.slice(1).filter(w => !STOP.has(w));
  if (!Q.length) return null;
  let r = searchStyle(W[0], Q);
  if (r.type === 'ok') return { type: 'ok', ref: refOf(r.sg) };
  if (r.type === 'none') {                                                // ¿está en otra lista? ("disco 4 cervezas" → cumbia)
    for (const st of STYLES) {
      if (st.key === W[0]) continue;
      const o = searchStyle(st.key, Q);
      if (o.type === 'ok') return { type: 'ok', ref: refOf(o.sg), moved: true };
    }
  }
  return r;
}

const voteRe = new RegExp('(?:^|[^a-záéíóúñ])(' + STYLES.map(s => s.key).join('|') + ')\\s*#?\\s*(\\d{1,3})(?!\\d)', 'i');
function parseRef(text) {
  const m = voteRe.exec(' ' + text);
  if (!m) return null;
  const st = styleBy(m[1].toLowerCase()), num = parseInt(m[2], 10);
  if (!st || num < 1 || num > st.list.length) return null;
  const rest = words((' ' + text).slice(m.index + m[0].length));       // "disco 4 cervezas" no es la canción 4
  if (rest.some(w => !STOP.has(w))) return null;
  return { style: st.key, num, title: st.list[num - 1], band: st.bands[num - 1] || '' };
}

    { transform: 'translateX(0)', offset: 0 },
    { transform: 'translateX(0)', offset: pause / (pause + move) },

  const sig = gifts.map(g => 'g' + g.ts + (g.text || '')).concat(votes.map(x => 'v' + x.num)).join(',');
  if (panel.dataset.sig === sig) {

  }).concat(votes.map((x, i) => ({ k: 'v' + x.num, h: 'v' + x.num, n: i + 1, count: x.count,

  box.querySelectorAll('.qempty').forEach(e => e.remove());
  const existing = {};

  box.querySelectorAll('.qrow').forEach(r => {

    if (r.dataset.k === 'v' + bumpNum) { r.classList.remove('bump'); void r.offsetWidth; r.classList.add('bump'); }
  });
}

  if (!CFG.showStats) { $('#stats').style.display = 'none'; return; }
  const rows = (list, amb) => list.length
    ? list.map((u, i) => `<div class="srow"><span class="nm ell">${i + 1}. ${esc(u.name)}</span><span class="val${amb ? ' amb' : ''}">${fmt(u.n)}</span></div>`).join('')
    : `<div class="srow none">—</div>`;
  $('#stats').innerHTML = `<h4>TOQUES</h4>${rows(top2(S.likes))}<h4 class="coins">MONEDAS</h4>${rows(top2(S.coins), true)}`;
}
let statsTimer = null;
function statsSoon() { if (!statsTimer) statsTimer = setTimeout(() => { statsTimer = null; renderStats(); }, 1000); }

/* ── Tarjeta Cómo pedir ─────────────────────────────────── */
function buildHowTo() {
  const st = styleBy(S.active);
  const exName = `${st.key} ${exampleOf(st)}`;
  const exNum = `${st.key} ${Math.min(12, st.list.length)}`;
  const cd = CFG.voteCooldownSec >= 60 ? `${Math.round(CFG.voteCooldownSec / 60)} min` : `${CFG.voteCooldownSec} s`;
  let d = 0; const D = () => `style="animation-delay:${0.45 + (d++) * 0.09}s"`;
  $('#howto').innerHTML = `
    <div class="glow"></div><div class="ttl">CÓMO PEDIR</div>
    <div class="step" ${D()}>1. Gratis: vota del repertorio</div>
    <div class="line" ${D()}>Comenta <span class="hl">"${esc(exName)}"</span></div>
    <div class="line" ${D()}>o su número: <span class="hl">"${esc(exNum)}"</span></div>
    <div class="line" ${D()}>La encuesta elige qué lista suena</div>
    <div class="line" ${D()}>Un voto cada ${cd}</div>
    <div class="step" ${D()}>2. Con regalo: salta la fila</div>
    <div class="line" ${D()}>Escribe tu canción y envía:</div>
    ${GIFTS.map(g => `<div class="gl" ${D()}>${giftIconHTML(g, '')}<b>${g.coins.toLocaleString('en-US')}</b>${mqHTML(g.card || g.reward)}</div>`).join('')}`;
  runMarquees($('#howto'));
}
let howHide;
function showHowTo() {
  const el = $('#howto');
  el.style.top = CFG.howToTop + 'px';
  buildHowTo();
  el.classList.remove('hide', 'show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(howHide);
  howHide = setTimeout(() => {
    el.classList.remove('show'); el.classList.add('hide');
    setTimeout(() => el.querySelectorAll('.mq > span').forEach(x => x.getAnimations().forEach(a => a.cancel())), 500);  // nada corre mientras está oculta
  }, CFG.howToShowSec * 1000);
}
setTimeout(showHowTo, 4000);
setInterval(showHowTo, CFG.howToEverySec * 1000);

/* ── Lógica del chat ────────────────────────────────────── */
function onChat(uid, name, text) {
  if (!uid || !text) return;
  const t = text.trim();
  const low = t.toLowerCase();

  dbg(`💬 @${uid}: ${t}`, 'ev');
  // Comandos (solo tu cuenta): "siguiente", "ritmo cumbia"… (también sirven con "!")
  const cmdText = toCommand(low);
  if (cmdText) {
    if (OWNERS.includes(uid.toLowerCase())) { dbg(`✔ comando ${cmdText}`, 'ok'); return command(cmdText); }
    if (low.startsWith('!')) { dbg(`✘ comando ignorado: @${uid} no está en owners (${OWNERS.join(', ')})`, 'no'); return; }
  }

  // ¿Tiene un pedido de regalo esperando su canción?
  const pending = S.gifts.find(g => g.uid === uid && !g.text && now() - g.ts < CFG.giftCommentAfterSec * 1000);
  if (pending) {
    const rr = resolveRequest(t), ref = rr && rr.type === 'ok' ? rr.ref : null;
    pending.text = ref ? ref.title : t.slice(0, 60);
    pending.style = ref ? ref.style : '';
    pending.band = ref ? ref.band : '';
    renderRequests(); save();
    dbg(`✔ canción para su regalo: ${pending.text}`, 'ok');
    return;
  }
  lastComment[uid] = { text: t, ts: now() };

  // Voto (cuenta para la fila de su ritmo, aunque no sea el que suena ahora)
  const rr = resolveRequest(t);
  if (!rr) return dbg('· no es pedido (empieza con "disco"/"cumbia")', 'no');
  if (rr.type === 'amb') { hintAmbiguous(rr); return dbg(`? "${rr.title}" está repetida (${rr.bands.join(' / ')}): falta el intérprete`, 'no'); }
  if (rr.type === 'vague') return dbg(`✘ muy general, coincide con: ${rr.titles.join(', ')}`, 'no');
  if (rr.type === 'none') return dbg('✘ no está en la lista', 'no');
  const ref = rr.ref;
  const cd = S.cooldown[uid];
  if (cd && now() - cd < CFG.voteCooldownSec * 1000) return dbg(`✘ en espera: puede votar en ${Math.ceil((CFG.voteCooldownSec * 1000 - (now() - cd)) / 1000)} s`, 'no');
  const V = VOTES(ref.style);
  const v = V[ref.num] || (V[ref.num] = { count: 0, first: now(), voters: [] });
  if (CFG.oneVotePerSong && v.voters.includes(uid)) return dbg(`✘ ya votó "${ref.title}" (se libera con "siguiente")`, 'no');
  v.count++; v.voters.push(uid);
  dbg(`✔ voto ${ref.style}${rr.moved ? ' (estaba en esa lista)' : ''}: ${ref.num} ${ref.title} – ${ref.band} (${v.count})`, 'ok');
  S.cooldown[uid] = now();
  scheduleQueue(ref.style, ref.num); save();
}

// Convierte lo que escribes en un comando interno, o null si no es comando
function toCommand(low) {
  const m = low.replace(/^!/, '').trim().split(/\s+/);
  if (m[0] === 'siguiente' && m.length <= 2) return '!d' + (m[1] ? ' ' + m[1] : '');   // siguiente / siguiente 12
  if (m[0] === 'ritmo' && m.length === 2 && styleBy(m[1])) return '!ritmo ' + m[1];      // ritmo cumbia
  if (low.startsWith('!')) return low;                                                   // !d, !g, !info, !reset…
  return null;
}

function command(c) {
  const [cmd, arg] = c.split(/\s+/);
  if (cmd === '!d') {                     // "siguiente": sale la primera de la fila del ritmo ACTUAL (o "siguiente 12")
    const k = S.active, V = VOTES(k);
    let num = parseInt(arg, 10);
    const gq = giftQueue(k);
    if (!num && gq.length) S.gifts.splice(S.gifts.indexOf(gq[0]), 1);   // primero los pedidos con regalo
    else {
      if (!num) { const q = queueItems(k); if (q.length) num = q[0].num; }
      if (num) delete V[num];                                           // votos a 0
    }
    renderQueue(k);
  } else if (cmd === '!ritmo' && styleBy(arg)) {   // "ritmo cumbia": cambia lo que suena (las filas se conservan)
    S.active = arg;
    renderQueues();
    showNowBig();                         // anuncia el cambio de inmediato
  } else if (cmd === '!g') {              // Galaxia atendida (la más antigua, o !g 2)
    const gl = galaxyList(), i = Math.max(0, (parseInt(arg, 10) || 1) - 1);
    if (gl[i]) S.gifts.splice(S.gifts.indexOf(gl[i]), 1);
    renderGifts();
  } else if (cmd === '!info') {
    showHowTo();
  } else if (cmd === '!reset') {          // empezar un live nuevo (borra todo)
    S.votes = {}; S.cooldown = {}; S.likes = {}; S.coins = {}; S.gifts = [];
    renderRequests(); renderStats();
  }
  save();
}

function matchGift(name, coins) {
  const n = (name || '').toLowerCase();
  return GIFTS.find(g => g.names.some(x => x.toLowerCase() === n))
      || (CFG.matchGiftByCoins ? GIFTS.find(g => g.coins === coins) : null);
}

function learnGiftImage(giftName, imageUrl) {
  if (!imageUrl) return;
  const n = (giftName || '').toLowerCase();
  const g = GIFTS.find(x => x.names.some(y => y.toLowerCase() === n));
  if (g && !g.img && S.giftImgs[g.key] !== imageUrl) {
    S.giftImgs[g.key] = imageUrl; renderChips(); renderRequests(); save();
    console.log(`[Cola] Imagen guardada para ${g.label}: ${imageUrl}`);
  }
}

function onGift(uid, name, giftName, coinsEach, count) {
  if (CFG.showStats) { const u = S.coins[uid] || (S.coins[uid] = { name, n: 0 }); u.name = name; u.n += coinsEach * count; statsSoon(); }

  const g = matchGift(giftName, coinsEach);
  if (g) {
    const prev = lastComment[uid];
    let text = '', style = '', band = '';
    if (prev && now() - prev.ts < CFG.giftCommentWindowSec * 1000) {
      const rr = resolveRequest(prev.text), ref = rr && rr.type === 'ok' ? rr.ref : null;
      text = ref ? ref.title : prev.text.slice(0, 60);
      style = ref ? ref.style : '';
      band = ref ? ref.band : '';
      delete lastComment[uid];
    }
    let ts = now(); while (S.gifts.some(x => x.ts === ts)) ts++;   // id único
    S.gifts.push({ uid, name, gift: g.key, text, style, band, at: S.active, ts });
    renderRequests();
  }
  save();
}

function onLike(uid, name, n) {
  if (!CFG.showStats) return;                                         // ranking oculto: no gastar nada en likes
  const u = S.likes[uid] || (S.likes[uid] = { name, n: 0 });
  u.name = name; u.n += n; statsSoon(); save();
}

/* ── TikFinity WebSocket ────────────────────────────────── */
let ws, reconnectTimer;
function setConn(t) { $('#conn').textContent = t; }
function connect() {
  try { ws = new WebSocket(CFG.wsUrl); } catch (e) { return scheduleReconnect(); }
  ws.onopen = () => { clearTimeout(reconnectTimer); setConn('TikFinity ✓'); dbg('Conectado a TikFinity ' + CFG.wsUrl, 'ok'); console.log('[Cola] Conectado a TikFinity'); };
  ws.onmessage = evt => {
    if (!CFG.showStats && evt.data.indexOf('"event":"like"') !== -1) return;   // taps: ni se leen
    let msg; try { msg = JSON.parse(evt.data); } catch { return; }
    const d = msg.data || {};
    const uid = d.uniqueId || d.userId || '';
    const name = d.nickname || d.uniqueId || 'anónimo';
    if (msg.event !== 'chat' && msg.event !== 'gift') dbg(`evento: ${msg.event}`, 'ev');
    if (msg.event === 'chat') onChat(uid, name, d.comment || '');
    else if (msg.event === 'like') onLike(uid, name, parseInt(d.likeCount || 1, 10));
    else if (msg.event === 'gift') {
      const giftName = d.originalName || d.giftName || d.name || '';
      learnGiftImage(giftName, d.giftPictureUrl || '');
      if (d.repeatEnd === false) return;               // esperar fin del combo
      const coins = parseInt(d.diamondCount ?? d.gift?.diamond_count ?? 0, 10);
      const count = parseInt(d.repeatCount || d.gift?.repeat_count || 1, 10);
      console.log(`[Cola] Regalo "${giftName}" ${coins} monedas x${count} de @${uid}`);
      dbg(`🎁 @${uid}: "${giftName}" ${coins} monedas x${count}`, "ev");
      onGift(uid, name, giftName, coins, count);
    }
  };
  ws.onerror = () => {};
  ws.onclose = () => { setConn('TikFinity ✗'); dbg('Sin conexión con TikFinity (' + CFG.wsUrl + '), reintentando en 5 s…', 'no'); scheduleReconnect(); };
}
function scheduleReconnect() { clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connect, 5000); }

/* ── Modo demo: cola.html?demo=1 simula un chat ─────────── */
function demo() {
  const names = ['Andrea', 'Lokito', 'Sumo', 'Luz', 'Marco', 'Kathy', 'Rolo', 'Vale', 'Pancho', 'Mery', 'Tito', 'Juanca'];
  let i = 0;
  setInterval(() => {
    const nm = names[Math.floor(Math.random() * names.length)];
    const uid = nm.toLowerCase() + (i++ % 40);
    const r = Math.random();
    if (r < 0.55) {
      const st = Math.random() < 0.6 ? styleBy(S.active) : STYLES[Math.floor(Math.random() * STYLES.length)];
      const pick = [10, 11, 12, 13, 15, 3, 7][Math.floor(Math.random() * 7)];
      const n = Math.min(pick, st.list.length);
      const asText = Math.random() < 0.5;                                // mitad por nombre, mitad por número
      onChat(uid, nm, asText ? `${st.key} ${(st.bands[n - 1] || '').toLowerCase()} ${st.list[n - 1].toLowerCase()}` : `${st.key} ${n}`);
    }
    else if (r < 0.57) onChat(uid, nm, 'disco regresa');               // nombre repetido → aviso
    else if (r < 0.85) onLike(nm, nm, 5 + Math.floor(Math.random() * 40));
    else if (r < 0.92) onGift(nm, nm, 'Rose', 1, 5);
    else if (r < 0.935) { onChat(nm, nm, 'disco 4'); onGift(nm, nm, 'Hat and Mustache', 99, 1); }
    else if (r < 0.94) { onChat(nm, nm, 'cumbia 2'); onGift(nm, nm, 'Amplificado', 249, 1); }
    else if (r < 0.97) { onGift(nm, nm, 'Galaxy', 1000, 1); setTimeout(() => onChat(nm, nm, 'Llorarás - Los Kjarkas'), 2500); }
  }, 900);
  setInterval(() => command('!d'), 25000);
  setInterval(() => command('!ritmo ' + STYLES[(STYLES.findIndex(s => s.key === S.active) + 1) % STYLES.length].key), 60000);
  setInterval(() => command('!g'), 33000);
}
addEventListener('keydown', e => { if (e.key === 'i' || e.key === 'I') showHowTo(); });

/* ── Inicio ─────────────────────────────────────────────── */
renderRequests(); renderStats();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { startScrolls(); runMarquees(reps); });
connect();
if (DEMO) demo();
window.cola = { showNowBig, chat: onChat, gift: onGift, like: onLike, command, showHowTo, learnGiftImage, resolve: resolveRequest };   // para pruebas desde la consola
})();
</script>
