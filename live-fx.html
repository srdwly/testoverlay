<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live FX Overlay</title>
<!--
  LIVE FX para TikTok LIVE Studio: corazón coreano ❤ + modo estrella 🎵 en un solo overlay.
    ❤  Corazón coreano con la mano de rasgueo, sostenido ~1 s → corazones desde los dedos
    🎵 Mano de rasgueo por encima del hombro → modo estrella con notas musicales

  Ya trae por defecto tus ajustes: rotate=90, hand=left, fit=contain, corazón sostenido 1 s, sin cartel.
  En Live Studio basta con:  live-fx.html      ·  Para calibrar:  live-fx.html?debug=1

  PARÁMETROS (todos opcionales):
    debug=1                     cámara, esqueleto, puntos de la mano y estado
    rotate=90                   rotación de la cámara: 0, 90, 180, 270
    hand=left                   mano de rasgueo: left/right (lado de la imagen) · any
    fit=contain                 contain = imagen completa · cover = llenar recortando
    mirror=1                    voltear horizontalmente
    cam=0                       índice de cámara
    camname=OBS                 elegir cámara por nombre (ej. OBS Virtual Camera)
    heart=0 / star=0            desactivar un efecto
    -- corazón --
    hearthold=1000              ms que hay que sostener el gesto (1000 ≈ tu hold=30)
    sens=1                      >1 más permisivo · <1 más estricto
    twohand=1                   también corazón grande con las dos manos
    -- modo estrella --
    above=0.15                  cuánto por encima del hombro debe pasar la mano
    starhold=3                  cuadros seguidos arriba para activar
    dur=6                       segundos que dura
    text=                       cartel (vacío = sin cartel), ej. text=¡A ROCKEAR!
    color=cyan|gold|purple      color del modo estrella
    -- otros --
    mode=all|detector|overlay   + relay=ws://localhost:8765  (detección en Chrome, dibujo en Live Studio)
    detsize=320                 tamaño del cuadro que se analiza (más chico = más rápido; 256-480)
    hq=1                        dibujar a resolución completa de pantalla (más pesado)
    tikfinity=1                 corazones también con regalos/likes de TikFinity

  Pruebas sin cámara: H = corazones · S = modo estrella · clic = corazones
-->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
  #cam { opacity: 0; }
  #status {
    position: fixed; left: 10px; top: 10px; padding: 6px 10px; border-radius: 6px; z-index: 5;
    font: 12px/1.35 ui-monospace, Consolas, monospace; color: #fff; background: rgba(0,0,0,.65);
    display: none; white-space: pre;
  }
  body.debug #cam { opacity: .55; }
  body.debug #status { display: block; }
</style>
</head>
<body>
<video id="vid" playsinline muted style="display:none"></video>
<canvas id="cam"></canvas>
<canvas id="debugLayer"></canvas>
<canvas id="fxStar"></canvas>
<canvas id="fxHeart"></canvas>
<div id="status">iniciando…</div>

<script type="module">
// ───────────────────────── Config (con tus valores por defecto) ─────────────────────────
const P = new URLSearchParams(location.search);
const num = (k, d) => (P.has(k) && P.get(k) !== '' && !isNaN(+P.get(k))) ? +P.get(k) : d;
const CFG = {
  mode:   P.get('mode') || 'all',
  relay:  P.get('relay') || 'ws://localhost:8765',
  debug:  P.get('debug') === '1',
  mirror: P.get('mirror') === '1',
  cam:    num('cam', 0),
  camname: (P.get('camname') || '').toLowerCase(),
  fit:    P.get('fit') === 'cover' ? 'cover' : 'contain',
  hand:   P.get('hand') || 'left',
  heartOn: P.get('heart') !== '0',
  starOn:  P.get('star') !== '0',
  // modo estrella
  dur:    num('dur', 6) * 1000,
  above:  num('above', 0.15),
  hold:   num('starhold', 3),
  text:   P.has('text') ? P.get('text') : '',
  cooldownMs: 1500,
  tikfinity: P.get('tikfinity') === '1',
  hq:     P.get('hq') === '1',                 // dibujar a resolución completa (más pesado)
  detSize: num('detsize', 320),                // tamaño (px, lado mayor) del cuadro que analiza el detector
};
if (!P.has('rotate')) P.set('rotate', '90');
// corazón
const HAND = CFG.hand;
const SENS = num('sens', 1);
const TWOHAND = P.get('twohand') === '1';
const HEART_HOLD_MS = num('hearthold', 1000);
const COOLDOWN_MS = 900;
const STREAM_MS = 280;
const DEBUG = CFG.debug;
const FIT = CFG.fit;
const MIRROR = CFG.mirror;

const PALETTES = {
  cyan:   { main: '#2ee6ff', glow: '#00b3ff', stars: ['#7df9ff', '#ffffff', '#ffe066', '#4dd2ff'] },
  gold:   { main: '#ffd23f', glow: '#ff9f1c', stars: ['#fff1a8', '#ffffff', '#ffd23f', '#ffb347'] },
  purple: { main: '#c77dff', glow: '#7b2cbf', stars: ['#e0aaff', '#ffffff', '#c77dff', '#7df9ff'] },
};
const PAL = PALETTES[P.get('color')] || PALETTES.cyan;

if (CFG.debug) document.body.classList.add('debug');
const statusEl = document.getElementById('status');
const setStatus = (t) => { statusEl.textContent = t; };

// ───────────────────────── Canvas ─────────────────────────
const fxHeart = document.getElementById('fxHeart'), fxStar = document.getElementById('fxStar');
const dbg = document.getElementById('debugLayer'), dctx = dbg.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = CFG.hq ? (window.devicePixelRatio || 1) : 1;
  W = innerWidth; H = innerHeight;
  for (const c of [fxHeart, fxStar, dbg]) { c.width = W * dpr; c.height = H * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); }
}
addEventListener('resize', resize); resize();

// ───────────────────────── Cámara: rotación y coordenadas ─────────────────────────
const video = document.getElementById('vid');
const camView = document.getElementById('cam');
// Rotación de la cámara (si está montada de lado): 0, 90, 180 o 270 grados en sentido horario
const ROT = ((parseInt(P.get('rotate') || '0', 10) % 360) + 360) % 360;
const frameCv = document.createElement('canvas'), fctx = frameCv.getContext('2d');
function frameSize() {
  const vw0 = video.videoWidth || 1280, vh0 = video.videoHeight || 720;
  return (ROT === 90 || ROT === 270) ? [vh0, vw0] : [vw0, vh0];
}
function grabFrame() {            // cuadro enderezado y REDUCIDO: el detector no necesita 1280 px y así va mucho más rápido
  const [fw0, fh0] = frameSize();
  const sc = Math.min(1, CFG.detSize / Math.max(fw0, fh0));
  const fw = Math.round(fw0 * sc), fh = Math.round(fh0 * sc);
  if (frameCv.width !== fw || frameCv.height !== fh) { frameCv.width = fw; frameCv.height = fh; }
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.translate(fw / 2, fh / 2); fctx.rotate(ROT * Math.PI / 180);
  const vw = ROT === 90 || ROT === 270 ? fh : fw, vh = ROT === 90 || ROT === 270 ? fw : fh;
  fctx.drawImage(video, -vw / 2, -vh / 2, vw, vh);
  return frameCv;
}
function showFrame(src) {         // vista previa solo en modo debug
  if (!document.body.classList.contains('debug')) return;
  const fw = src.width, fh = src.height;
  if (camView.width !== fw || camView.height !== fh) { camView.width = fw; camView.height = fh; }
  camView.getContext('2d').drawImage(src, 0, 0, fw, fh);
}
// Rectángulo (en pantalla) donde se ve la imagen de la cámara
function camRect() {
  const [vw, vh] = frameSize();
  const s = (FIT === 'contain' ? Math.min : Math.max)(W / vw, H / vh), w = vw * s, h = vh * s;
  return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}
function toScreen(nx, ny) {
  const [vw, vh] = frameSize();
  const s = (FIT === 'contain' ? Math.min : Math.max)(W / vw, H / vh), dw = vw * s, dh = vh * s;
  if (MIRROR) nx = 1 - nx;
  return [(W - dw) / 2 + nx * dw, (H - dh) / 2 + ny * dh];
}

// ───────────────────────── Efecto: corazones ─────────────────────────
const HeartFX = (() => {
  const ctx = fxHeart.getContext('2d');
const PALETTE = [
  ['#ff4d6d', '#c9184a'], ['#ff758f', '#ff4d6d'], ['#ff8fab', '#fb6f92'],
  ['#ff5e78', '#d90429'], ['#ffb3c6', '#ff4d6d']
];
const particles = [];

function heartPath(c, s) {
  // corazón centrado en (0,0) de tamaño ~s
  c.beginPath();
  c.moveTo(0, s * 0.3);
  c.bezierCurveTo(-s * 0.05, s * 0.25, -s * 0.5, s * 0.05, -s * 0.5, -s * 0.2);
  c.bezierCurveTo(-s * 0.5, -s * 0.45, -s * 0.25, -s * 0.55, 0, -s * 0.33);
  c.bezierCurveTo(s * 0.25, -s * 0.55, s * 0.5, -s * 0.45, s * 0.5, -s * 0.2);
  c.bezierCurveTo(s * 0.5, s * 0.05, s * 0.05, s * 0.25, 0, s * 0.3);
  c.closePath();
}

// sprites: cada color de corazón se dibuja UNA vez con su brillo; luego solo se copia (muy barato)
const HS = 128;
const heartSprites = PALETTE.map(([c1, c2]) => {
  const oc = document.createElement('canvas'); oc.width = oc.height = HS * 2;
  const o = oc.getContext('2d'); o.translate(HS, HS);
  const s = HS * 1.2;
  o.shadowColor = c1; o.shadowBlur = s * 0.3;
  const g = o.createLinearGradient(0, -s * 0.5, 0, s * 0.3);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  o.fillStyle = g; heartPath(o, s); o.fill();
  o.shadowBlur = 0; o.globalAlpha = 0.55; o.fillStyle = '#fff';
  o.beginPath(); o.ellipse(-s * 0.24, -s * 0.24, s * 0.1, s * 0.06, -0.6, 0, Math.PI * 2); o.fill();
  return oc;
});

function spawnHeart(x, y, opts = {}) {
  const big = !!opts.big;
  const pi = (Math.random() * PALETTE.length) | 0, [c1, c2] = PALETTE[pi];
  particles.push({ spr: heartSprites[pi],
    kind: 'heart', x, y,
    vx: (Math.random() - 0.5) * (big ? 40 : 70),
    vy: -(big ? 120 : 160 + Math.random() * 120),
    size: (big ? 150 : 46 + Math.random() * 34) * (opts.scale || 1),
    rot: (Math.random() - 0.5) * 0.5, vr: (Math.random() - 0.5) * 1.2,
    wob: Math.random() * Math.PI * 2,
    life: 0, ttl: big ? 2.2 : 1.6 + Math.random() * 0.7,
    c1, c2
  });
  // chispas
  const n = big ? 14 : 6;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (big ? 220 : 140) * (0.4 + Math.random());
    particles.push({
      kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      size: 2 + Math.random() * 3, life: 0, ttl: 0.5 + Math.random() * 0.5,
      c1: Math.random() < 0.5 ? '#fff' : c1
    });
  }
}

function burst(x, y, big = false) {
  if (big) { spawnHeart(x, y, { big: true }); for (let i = 0; i < 6; i++) setTimeout(() => spawnHeart(x + (Math.random() - .5) * 80, y, { scale: 0.8 }), i * 70); }
  else { spawnHeart(x, y); setTimeout(() => spawnHeart(x, y, { scale: 0.7 }), 90); }
}

let last = performance.now(), dirty = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!particles.length) {                       // nada que dibujar: no gastar
    if (dirty) { ctx.clearRect(0, 0, W, H); dirty = false; }
    return requestAnimationFrame(frame);
  }
  dirty = true;
  ctx.clearRect(0, 0, W, H);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.ttl) { particles.splice(i, 1); continue; }
    const t = p.life / p.ttl;
    if (p.kind === 'heart') {
      p.wob += dt * 4;
      p.x += (p.vx + Math.sin(p.wob) * 30) * dt;
      p.y += p.vy * dt;
      p.vy *= 0.995;
      p.rot += p.vr * dt;
      // pop: crece rápido con rebote y luego se desvanece
      const pop = t < 0.18 ? easeOutBack(t / 0.18) : 1 + (t - 0.18) * 0.15;
      const alpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
      const s = p.size * pop, w = s * (2 * HS) / (HS * 1.2);   // tamaño del sprite para un corazón de tamaño s
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.drawImage(p.spr, -w / 2, -w / 2, w, w);
      ctx.restore();
    } else {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy = p.vy * 0.96 + 30 * dt;
      ctx.globalAlpha = 1 - t; ctx.fillStyle = p.c1;
      const r = p.size * (1 - t * 0.5); ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(frame);
}
function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
requestAnimationFrame(frame);

  return { burst, spawnHeart };
})();

// ───────────────────────── Efecto: modo estrella ─────────────────────────
const StarFX = (() => {
  const ctx = fxStar.getContext('2d');
  // El modo estrella se dibuja solo dentro del área de la cámara (ya rotada), no en todo el overlay.
  let W = 0, H = 0, OX = 0, OY = 0;
  function syncRect() { const r = camRect(); W = r.w; H = r.h; OX = r.x; OY = r.y; }
  syncRect();
// ───────────────────────── Sprites (estrellas con brillo pre-renderizado) ─────────────────────────
function starPath(c, r, inner = 0.45, points = 5) {
  c.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / points, rr = i % 2 ? r * inner : r;
    c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  c.closePath();
}
const SPRITE = 64;
// Dibuja una nota musical centrada en (0,0) con altura ~r*2. type: 0 negra · 1 corchea · 2 dos corcheas unidas
function notePath(o, r, type) {
  const head = (cx, cy) => { o.beginPath(); o.ellipse(cx, cy, r * 0.32, r * 0.23, -0.45, 0, Math.PI * 2); o.fill(); };
  const lw = r * 0.1;
  if (type === 2) {
    const x1 = -r * 0.42, x2 = r * 0.5, y1 = r * 0.62, y2 = r * 0.5, top1 = -r * 0.75, top2 = -r * 0.87;
    head(x1, y1); head(x2, y2);
    o.fillRect(x1 + r * 0.27, top1, lw, y1 - top1 - r * 0.05);
    o.fillRect(x2 + r * 0.27, top2, lw, y2 - top2 - r * 0.05);
    o.beginPath(); o.moveTo(x1 + r * 0.27, top1); o.lineTo(x2 + r * 0.27 + lw, top2);
    o.lineTo(x2 + r * 0.27 + lw, top2 + r * 0.22); o.lineTo(x1 + r * 0.27, top1 + r * 0.22); o.closePath(); o.fill();
  } else {
    const hx = -r * 0.15, hy = r * 0.6, sx = hx + r * 0.27, top = -r * 0.85;
    head(hx, hy);
    o.fillRect(sx, top, lw, hy - top - r * 0.05);
    if (type === 1) {
      o.beginPath(); o.moveTo(sx + lw, top);
      o.bezierCurveTo(sx + r * 0.25, top + r * 0.3, sx + r * 0.7, top + r * 0.35, sx + r * 0.45, top + r * 0.95);
      o.bezierCurveTo(sx + r * 0.55, top + r * 0.5, sx + r * 0.3, top + r * 0.42, sx + lw, top + r * 0.35);
      o.closePath(); o.fill();
    }
  }
}
const sprites = [];
for (const col of PAL.stars) for (const type of [0, 1, 1, 2]) {
  const oc = document.createElement('canvas'); oc.width = oc.height = SPRITE * 2;
  const o = oc.getContext('2d'); o.translate(SPRITE, SPRITE);
  o.shadowColor = col; o.shadowBlur = SPRITE * 0.35; o.fillStyle = col;
  notePath(o, SPRITE * 0.62, type);
  o.shadowBlur = 0; notePath(o, SPRITE * 0.62, type);
  sprites.push(oc);
}

// ───────────────────────── Efecto Modo Estrella ─────────────────────────
const star = { active: false, start: 0, end: 0, ox: 0, oy: 0, lastBolt: 0, nextBolt: 0, spawnAcc: 0 };
const parts = [], rings = [], bolts = [];

function triggerStar(x = W / 2, y = H * 0.4) {
  const now = performance.now();
  if (star.active) { star.end = now + CFG.dur; }           // re-activado: extiende
  else { star.active = true; star.start = now; star.end = now + CFG.dur; }
  star.ox = x; star.oy = y; star.flash = now;
  rings.push({ x, y, t: 0, ttl: 0.75, w: 14 }, { x, y, t: -0.12, ttl: 0.85, w: 6 });
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2, sp = 250 + Math.random() * 650;
    parts.push(newStar(x, y, Math.cos(a) * sp, Math.sin(a) * sp, 14 + Math.random() * 22, 0.9 + Math.random() * 0.6, true));
  }
  bolts.push(makeEdgeBolt(), makeEdgeBolt());
}

function newStar(x, y, vx, vy, size, ttl, drag = false) {
  return { x, y, vx, vy, size, ttl, t: 0, rot: (Math.random() - .5) * 0.6, vr: (Math.random() - .5) * 0.5,
           spr: sprites[(Math.random() * sprites.length) | 0], drag };
}

// Rayo a lo largo de un borde lateral (no tapa la cara del centro)
function makeEdgeBolt() {
  const left = Math.random() < 0.5;
  const x0 = left ? W * (0.02 + Math.random() * 0.1) : W * (0.88 + Math.random() * 0.1);
  const y0 = Math.random() * H * 0.3, y1 = H * (0.6 + Math.random() * 0.4);
  let pts = [[x0, y0], [x0 + (Math.random() - .5) * W * 0.08, y1]];
  for (let k = 0; k < 6; k++) {                     // desplazamiento de punto medio
    const np = [pts[0]], amp = W * 0.06 / (k + 1);
    for (let i = 1; i < pts.length; i++) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
      np.push([(ax + bx) / 2 + (Math.random() - .5) * amp, (ay + by) / 2], pts[i]);
    }
    pts = np;
  }
  return { pts, t: 0, ttl: 0.22 };
}

function envelope(now) {
  if (!star.active) return 0;
  const a = (now - star.start) / 180, b = (star.end - now) / 900;
  return Math.max(0, Math.min(1, a, b));
}

let last = performance.now(), dirty = false, glowCache = null;
function edgeGlow() {                            // degradado de bordes: se crea una vez por tamaño
  if (glowCache && glowCache.w === W && glowCache.h === H) return glowCache.cv;
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(W)); cv.height = Math.max(1, Math.round(H));
  const o = cv.getContext('2d');
  const g = o.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.hypot(W, H) * 0.55);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.6, hexA(PAL.glow, 0.18)); g.addColorStop(1, hexA(PAL.main, 0.65));
  o.fillStyle = g; o.fillRect(0, 0, W, H);
  glowCache = { w: W, h: H, cv };
  return cv;
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (star.active && now > star.end) star.active = false;
  if (!star.active && !parts.length && !rings.length && !bolts.length) {   // en reposo: no dibujar nada
    if (dirty) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); ctx.restore(); dirty = false; }
    return requestAnimationFrame(frame);
  }
  dirty = true;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); ctx.restore();
  syncRect();
  ctx.save(); ctx.translate(OX, OY); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();   // solo dentro de la cámara
  if (star.active && now > star.end) star.active = false;
  const k = envelope(now);
  const t = (now - star.start) / 1000;

  // 1) Resplandor en los bordes (pulsante)
  if (k > 0) {
    const pulse = 0.75 + 0.25 * Math.sin(t * 9);
    ctx.globalAlpha = k * pulse; ctx.drawImage(edgeGlow(), 0, 0, W, H); ctx.globalAlpha = 1;
  }

  // 2) Destello inicial
  if (star.flash) {
    const f = 1 - (now - star.flash) / 260;
    if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${0.45 * f})`; ctx.fillRect(0, 0, W, H); }
  }

  ctx.globalCompositeOperation = 'lighter';

  // 3) Ondas expansivas
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += dt;
    if (r.t >= r.ttl) { rings.splice(i, 1); continue; }
    if (r.t < 0) continue;
    const p = r.t / r.ttl, rad = easeOut(p) * Math.hypot(W, H) * 0.6;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2);
    ctx.strokeStyle = hexA(PAL.glow, (1 - p) * 0.35); ctx.lineWidth = r.w * (1 - p) * 3 + 4; ctx.stroke();
    ctx.strokeStyle = hexA(PAL.main, (1 - p) * 0.9); ctx.lineWidth = r.w * (1 - p) + 1; ctx.stroke();
  }

  // 4) Estrellas que suben desde abajo mientras dura el modo
  if (k > 0) {
    star.spawnAcc += dt * 22 * k;
    while (star.spawnAcc >= 1) {
      star.spawnAcc--;
      const edge = Math.random() < 0.7;  // mayormente por los lados, para no tapar al guitarrista
      const x = edge ? (Math.random() < .5 ? Math.random() * W * 0.22 : W - Math.random() * W * 0.22) : Math.random() * W;

// ───────────────────────── Detector: corazón coreano ─────────────────────────
const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* Landmarks MediaPipe: 0 muñeca · 1-4 pulgar · 5-8 índice · 9-12 medio · 13-16 anular · 17-20 meñique
   Corazón coreano (versión estricta, para que un puño NO cuente):
     1. medio, anular y meñique bien doblados
     2. el índice NO está metido en la palma (en un puño sí lo está)
     3. la punta del pulgar asoma más allá de la 2ª articulación del índice (cruce de dedos)
     4. punta del pulgar y punta del índice cerca una de otra, cruzándose
   Además hay que mantenerlo `hold` cuadros seguidos. */
function heartChecks(L) {
  const size = d(L[0], L[9]);
  if (size < 0.04) return { ok: false, far: true };
  const curled = (tip, pip) => d(L[tip], L[0]) < d(L[pip], L[0]) * 1.0 * SENS;
  const others = [curled(12, 10), curled(16, 14), curled(20, 18)].filter(Boolean).length === 3;
  const indexOut = d(L[8], L[0]) > d(L[6], L[0]) * (1.08 / SENS);
  const thumbOut = d(L[4], L[0]) > d(L[6], L[0]) * (1.0 / SENS);
  const cross = Math.min(d(L[4], L[7]), d(L[4], L[8]), d(L[3], L[7])) / size < 0.32 * SENS
             && d(L[4], L[8]) / size < 0.5 * SENS;
  return { ok: others && indexOut && thumbOut && cross, others, indexOut, thumbOut, cross };
}

/* Corazón grande con las dos manos (desactivado por defecto; activar con twohand=1). */
function isTwoHandHeart(A, B) {
  const size = (d(A[0], A[9]) + d(B[0], B[9])) / 2;
  return d(A[8], B[8]) / size < 0.45 * SENS && d(A[4], B[4]) / size < 0.45 * SENS;
}

/* Elegir solo la mano de rasgueo.
   hand=left  → la mano que aparece a la IZQUIERDA de la imagen (la misma convención que star-mode)
   hand=right → la de la derecha · hand=any → cualquiera
   Con dos manos se usa la posición; con una sola, la etiqueta de MediaPipe (que asume imagen en espejo,
   por eso la mano que se ve a la izquierda en una cámara normal viene etiquetada "Left"). */

  if (HAND === 'any') return landmarks.map((L, i) => i);
  if (landmarks.length >= 2) {
    const order = landmarks.map((L, i) => i).sort((a, b) => landmarks[a][0].x - landmarks[b][0].x);
    return [HAND === 'left' ? order[0] : order[order.length - 1]];
  }
  if (landmarks.length === 1) {
    const label = handedness?.[0]?.[0]?.categoryName;
    if (!label) return [0];
    return label === (HAND === 'left' ? 'Left' : 'Right') ? [0] : [];
  }
  return [];
}

const state = { held: 0, two: 0, lastFire: 0, lastStream: 0 };

function onLandmarks(hands, strumIdx, now) {
  let event = null;
  if (TWOHAND && hands.length === 2 && isTwoHandHeart(hands[0], hands[1])) {
    state.two++;
    if (state.two >= 6 && now - state.lastFire > COOLDOWN_MS * 1.5) {
      const A = hands[0], B = hands[1];
      const cx = (A[8].x + B[8].x + A[4].x + B[4].x) / 4;
      const cy = (A[8].y + B[8].y + A[4].y + B[4].y) / 4;
      event = { type: 'heart', big: true, nx: cx, ny: cy };
      state.lastFire = now;
    }
  } else state.two = 0;

  const L = strumIdx.length ? hands[strumIdx[0]] : null;
  if (L && isFingerHeart(L)) {
    if (!state.heldSince) state.heldSince = now;
    state.held = now - state.heldSince;
    const nx = (L[4].x + L[7].x) / 2, ny = (L[4].y + L[7].y) / 2 - 0.02;
    if (state.held >= HEART_HOLD_MS && !event) {

      } else if (now - state.lastStream > STREAM_MS) {

      }
    }

// ───────────────────────── Detector: modo estrella ─────────────────────────
function makeRaiseDetector(cfg) {
  const ema = {}, prev = {}, overCount = { 15: 0, 16: 0 }, armed = { 15: false, 16: false };
  const act = { 15: 0, 16: 0 };
  let lastFire = -1e9, lastT = null, strumHand = null;
  const info = { 15: { above: 0, role: '', armed: false }, 16: { above: 0, role: '', armed: false } };
  function update(L, now) {
    const dt = lastT == null ? 33 : Math.min(200, now - lastT); lastT = now;
    if (!L) { delete prev[15]; delete prev[16]; overCount[15] = overCount[16] = 0; return null; }
    const ls = L[11], rs = L[12];
    const shouldersOk = (ls.visibility ?? 1) > 0.5 && (rs.visibility ?? 1) > 0.5;
    const scale = shouldersOk ? Math.max(0.05, Math.hypot(ls.x - rs.x, ls.y - rs.y)) : 0.25;
    const shoulderY = shouldersOk ? (ls.y + rs.y) / 2 : 0.45;

    const ys = {};
    for (const w of [15, 16]) {
      const p = L[w];
      if ((p.visibility ?? 1) < 0.3) { delete ema[w]; delete prev[w]; overCount[w] = 0; continue; }
      ema[w] = ema[w] == null ? p.y : ema[w] * 0.35 + p.y * 0.65;
      ys[w] = ema[w];
      if (prev[w] != null) {
        const speed = Math.abs(ys[w] - prev[w]) / scale / (dt / 1000);
        act[w] += (Math.min(speed, 8) - act[w]) * Math.min(1, dt / 3000);
      }
      prev[w] = ys[w];
    }

    // ¿qué mano rasguea?
    if (cfg.hand === 'left') strumHand = 16;           // 16 = muñeca a la izquierda de la imagen (sin espejo)
    else if (cfg.hand === 'right') strumHand = 15;
    else if (cfg.hand === 'auto' && act[15] + act[16] > 0.3) {
      if (act[15] > act[16] * 1.6) strumHand = 15; else if (act[16] > act[15] * 1.6) strumHand = 16;
    }

    let fired = null;
    for (const w of [15, 16]) {
      info[w].role = strumHand == null ? '' : (w === strumHand ? 'rasgueo' : 'mástil');
      if (ys[w] == null) continue;
      const above = (shoulderY - ys[w]) / scale;
      info[w].above = above;
      if (above < cfg.above - 0.3) armed[w] = true;    // la mano bajó: listo para el próximo gesto
      info[w].armed = armed[w];
      const counts = cfg.hand === 'any' || strumHand == null || w === strumHand;
      if (!counts) { overCount[w] = 0; continue; }
      overCount[w] = above >= cfg.above ? overCount[w] + 1 : 0;
      if (!fired && armed[w] && overCount[w] >= cfg.hold && now - lastFire > cfg.cooldownMs) {
        fired = { type: 'star', nx: L[w].x, ny: L[w].y, wrist: w };
        lastFire = now; armed[w] = false;
      }
    }
    return fired;
  }
  return { update, info, act, get lastFire() { return lastFire; }, get strumHand() { return strumHand; } };
}
const detector = makeRaiseDetector(CFG);
window.__fx = { makeRaiseDetector, heartChecks, pickStrumHand, HeartFX, StarFX, CFG };

// ───────────────────────── Abrir la cámara sin tocar la webcam física ─────────────────────────
/* Antes se abría primero la cámara "por defecto" solo para pedir permiso; si OBS tenía la webcam,
   eso daba "Device in use" y además congelaba la fuente en OBS. Ahora:
   1) si el navegador ya conoce los nombres de las cámaras, abre DIRECTO la elegida (sin sondeo);
   2) si recuerda la cámara que funcionó la última vez, la abre directo;
   3) solo si no sabe nada, pide permiso una vez (y si falla, vuelve a buscar por nombre). */
async function openCamera() {
  const C = { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } };
  const gum = (id) => navigator.mediaDevices.getUserMedia({ video: id ? { ...C, deviceId: { exact: id } } : C });
  const list = async () => (await navigator.mediaDevices.enumerateDevices()).filter(x => x.kind === 'videoinput');
  const pick = (cams) => CFG.camname ? cams.find(c => (c.label || '').toLowerCase().includes(CFG.camname)) : cams[CFG.cam];
  const KEY = 'livefx-cam-' + (CFG.camname || CFG.cam);
  const remember = (stream) => {
    const tr = stream.getVideoTracks()[0];
    camLabel = tr?.label || '?';
    try { localStorage.setItem(KEY, tr.getSettings().deviceId || ''); } catch {}
    if (CFG.camname && !camLabel.toLowerCase().includes(CFG.camname)) {
      stream.getTracks().forEach(t => t.stop());
      throw new Error(`Se abrió "${camLabel}" en vez de una cámara con "${CFG.camname}".`);
    }
    return stream;
  };

  let cams = await list();
  camList = cams.map((c, i) => `${i}: ${c.label || '(sin nombre)'}`);

  // 1) nombres visibles → abrir directo
  if (cams.some(c => c.label)) {
    const chosen = pick(cams);
    if (!chosen) throw new Error(`No encontré la cámara "${CFG.camname || CFG.cam}".`);
    return remember(await gum(chosen.deviceId));
  }
  // 2) cámara recordada
  let saved = null; try { saved = localStorage.getItem(KEY); } catch {}
  if (saved) { try { return remember(await gum(saved)); } catch (e) { console.warn('cámara recordada falló', e); } }
  // 3) primera vez: pedir permiso
  try {
    const s = await gum(null);
    const label = s.getVideoTracks()[0]?.label || '';
    if (!CFG.camname || label.toLowerCase().includes(CFG.camname)) return remember(s);
    s.getTracks().forEach(t => t.stop());
  } catch (e) {
    if (e.name === 'NotAllowedError') throw e;   // permiso negado: no hay nada más que hacer
  }
  cams = await list();
  camList = cams.map((c, i) => `${i}: ${c.label || '(sin nombre)'}`);
  const chosen = pick(cams);
  if (!chosen) throw new Error(`No encontré la cámara "${CFG.camname || CFG.cam}".`);
  return remember(await gum(chosen.deviceId));
}

    })) : null;
    const poseModel = CFG.starOn ? await withFallback((delegate) => PoseLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', delegate },
      runningMode: 'VIDEO', numPoses: 1,
      minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5
    })) : null;

    setStatus('abriendo cámara…');
    video.srcObject = await openCamera();
    await video.play();
    if (CFG.mirror) camView.style.transform = 'scaleX(-1)';
    camView.style.objectFit = FIT;

    // Los modelos se turnan para no cargar la PC. El cuerpo (modo estrella) tiene prioridad porque
    // el gesto es rápido: 2 de cada 3 cuadros van al cuerpo y 1 a la mano (el corazón se sostiene).
    let lastVT = -1, frames = 0, fpsT = performance.now(), turn = 0;
    const ema = (old, v) => old ? old * 0.9 + v * 0.1 : v;
    const process = () => {
      const now = performance.now();
      if (video.currentTime !== lastVT && video.readyState >= 2) {
        lastVT = video.currentTime;
        const frameSrc = grabFrame(); showFrame(frameSrc);
        const doHand = handModel && (!poseModel || turn % 3 === 0);
        const doPose = poseModel && (!handModel || turn % 3 !== 0);
        turn++;
        if (doHand) {
          const t0 = performance.now();
          const res = handModel.detectForVideo(frameSrc, now);
          perf.hand = ema(perf.hand, performance.now() - t0);
          dbgState.hands = res.landmarks || [];
          dbgState.strumIdx = pickStrumHand(dbgState.hands, res.handedness || res.handednesses);
          emit(onLandmarks(dbgState.hands, dbgState.strumIdx, now));
        }
        if (doPose) {
          const t0 = performance.now();
          dbgState.pose = poseModel.detectForVideo(frameSrc, now).landmarks?.[0] || null;
          perf.pose = ema(perf.pose, performance.now() - t0);
          emit(detector.update(dbgState.pose, now));
        }
        frames++; if (now - fpsT > 1000) { dbgState.fps = frames; frames = 0; fpsT = now; }
        drawDebug();
      }
    };
    // requestVideoFrameCallback: procesa exactamente cada cuadro nuevo de la cámara
    if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
      const onFrame = () => { process(); video.requestVideoFrameCallback(onFrame); };
      video.requestVideoFrameCallback(onFrame);
    } else {
      const loop = () => { process(); requestAnimationFrame(loop); };
      loop();
    }
  } catch (e) {
    console.error(e);
    setStatus('⚠ ' + e.message + (camList.length ? '\n\nCámaras:\n' + camList.join('\n') : '') + '\n(H = corazones · S = modo estrella)');
    document.body.classList.add('debug');
  }
}
start();
</script>
</body>
</html>
