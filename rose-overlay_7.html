<script>
/* ════════════════════════════════════════════════════════════════

const CFG = {

  maxSizeMult: 2.8,       // los regalos caros crecen hasta este múltiplo
  gravity: 1800,          // px/s² (más alto = caen más rápido)

  pileMaxHeight: 0.42,    // si la pila supera esta altura (proporción del alto), se van los más viejos

  depth: true,            // profundidad 3D: unos regalos quedan más atrás (más chicos y oscuros)
  depthFloor: 0.06,       // cuánto más arriba se apoyan los del fondo (proporción del alto) → perspectiva
  bigGiftCoins: 100,      // desde cuántas monedas un regalo hace "onda" de impacto

  // ── PALOMITAS ──
  popBounce: 0.55,        // rebote del primer golpe (después rebota menos: 2-3 saltitos)
  squash: true,           // se aplasta al caer y vuelve a su forma (como una palomita)
  chain: true,            // al caer, los regalos cercanos de la pila saltan
  chainRadius: 3.2,       // qué tan lejos llega el salto (en tamaños de regalo)
  chainKick: 800,         // fuerza del salto de los vecinos
  bigWave: true,          // los regalos grandes (≥ bigGiftCoins) hacen saltar TODA la pila en una onda
  kernel: false,          // el regalo sale como un granito de maíz y REVIENTA en el aire (también con ?kernel=1)

  // ── AGARRAR REGALOS CON LA MANO (cámara) ──  se activa con ?hands=1
  // Puño = agarra (primero los grandes que estén en tu mano; si no hay, el más cercano) · mano abierta = suelta / lanza.
  // MÁS LIVIANO: como fuente de navegador EN OBS (1080×1920, encima de la cámara) con ?hands=1&manos=1 → las manos
  // llegan de manos.html (abierto en Chrome); no abre la cámara ni carga el modelo (rotate lo hace manos.html).
  // En Live Studio haría falta además #obspass=TU_CONTRASEÑA al final del enlace.
  hands: false,
  manos: false,
  camname: 'obs',         // cámara por nombre (OBS Virtual Camera); si no la encuentra usa la cámara "cam"
  camAvoid: '',           // evita cámaras con este nombre (la vista previa evita 'obs' para usar tu webcam)
  obsRotate: 90,          // cámara de OBS horizontal (sin ?rotate=) se gira así; si OBS ya la manda vertical, no se gira
  cam: 0,
  rotate: 90,             // igual que live-fx: 0, 90, 180, 270
  fit: 'contain',         // contain | cover (igual que tu fuente de cámara)
  mirror: false,
  handFps: 20,            // cuántas veces por segundo se mira la mano (más = más fluido, más procesador)
  detSize: 256,           // tamaño del cuadro que analiza el detector
  grabRadius: 1.5,        // alcance para agarrar (en tamaños de palma)
  fistFingers: 3,         // cuántos dedos (de 4) deben estar cerrados para contar como puño
  confirmFrames: 2,       // cuadros seguidos para confirmar puño / mano abierta (evita falsos)
  throwMult: 1.0,         // fuerza del lanzamiento al soltar (0 = solo se cae)
  lostMs: 500,            // si no se ve la mano por este tiempo, el regalo se suelta
  debug: false,           // ?debug=1 muestra la cámara, los puntos de la mano y el alcance
  mouse: false,           // ?mouse=1 para probar sin cámara: mantener clic = puño
  showCam: false,         // ?showcam=1 muestra la cámara detrás de los regalos (para probar en el navegador)
  // ── FICHAS 3D ──  ?ficha=siempre | mano | 0
  // 'siempre' = giran en 3D desde que los lanzan y quedan un poco inclinados en la pila
  // 'mano'    = planos como antes; se vuelven ficha 3D solo al levantarlos con el puño (y vuelven a planos al asentarse)
  // 'off'     = todo plano (como la versión anterior)
  ficha3d: 'off',    
  fichaGrosor: 0.22,      // grosor de la ficha (proporción del tamaño del regalo)
  fichaInclina: 28,       // inclinación máxima (grados) con la que quedan en la pila en modo 'siempre'
  floorUp: 0,             // sube el piso (proporción del alto). Ej.: 0.15 → la pila queda un poco más arriba
};
{ const Q = new URLSearchParams(location.search);               // interruptores por el enlace: ?kernel=1  ?mode=lluvia
  if (Q.has('kernel')) CFG.kernel = Q.get('kernel') === '1';
  if (Q.get('mode') === 'lluvia' || Q.get('mode') === 'lanzado') CFG.mode = Q.get('mode');
  if (Q.has('chain')) CFG.chain = Q.get('chain') !== '0';
  const n = (k, d) => (Q.has(k) && Q.get(k) !== '' && !isNaN(+Q.get(k))) ? +Q.get(k) : d;
  if (Q.has('hands')) CFG.hands = Q.get('hands') === '1';
  if (Q.has('manos')) CFG.manos = Q.get('manos') === '1';
  if (Q.has('camname')) CFG.camname = Q.get('camname').toLowerCase();
  CFG.rotateSet = Q.has('rotate');
  CFG.cam = n('cam', CFG.cam); CFG.rotate = ((n('rotate', CFG.rotate) % 360) + 360) % 360;
  if (Q.has('fit')) CFG.fit = Q.get('fit') === 'cover' ? 'cover' : 'contain';
  if (Q.has('mirror')) CFG.mirror = Q.get('mirror') === '1';
  CFG.grabRadius = n('grab', CFG.grabRadius); CFG.fistFingers = n('fingers', CFG.fistFingers);
  CFG.throwMult = n('throw', CFG.throwMult); CFG.handFps = n('handfps', CFG.handFps); CFG.detSize = n('detsize', CFG.detSize);
  if (Q.has('debug')) CFG.debug = Q.get('debug') === '1';
  if (Q.has('mouse')) CFG.mouse = Q.get('mouse') === '1';
  if (Q.has('showcam')) CFG.showCam = Q.get('showcam') === '1';
  CFG.floorUp = n('floorup', CFG.floorUp);
  if (Q.has('ficha')) { const f = Q.get('ficha'); CFG.ficha3d = f === 'mano' ? 'mano' : (f === '0' || f === 'off') ? 'off' : 'siempre'; }
  CFG.maxItems = n('max', CFG.maxItems); CFG.baseSize *= n('size', 1); }

/* ════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  wake();
}
addEventListener('resize', resize);

const now = () => performance.now();
const rand = (a, b) => a + Math.random() * (b - a);
const FLOOR = () => H * (1 - CFG.floorUp);              // altura del piso
const L = () => W * CFG.areaLeft / 100, R = () => W * CFG.areaRight / 100;
const F3D = () => CFG.ficha3d !== 'off';

/* ── Matrices 3×3 (por filas) para las fichas 3D ── */
const mmul = (a, b) => [
  a[0] * b[0] + a[1] * b[3] + a[2] * b[6], a[0] * b[1] + a[1] * b[4] + a[2] * b[7], a[0] * b[2] + a[1] * b[5] + a[2] * b[8],
  a[3] * b[0] + a[4] * b[3] + a[5] * b[6], a[3] * b[1] + a[4] * b[4] + a[5] * b[7], a[3] * b[2] + a[4] * b[5] + a[5] * b[8],
  a[6] * b[0] + a[7] * b[3] + a[8] * b[6], a[6] * b[1] + a[7] * b[4] + a[8] * b[7], a[6] * b[2] + a[7] * b[5] + a[8] * b[8]];

const IDM = () => [1, 0, 0, 0, 1, 0, 0, 0, 1];
const rotY = t => { const c = Math.cos(t), s = Math.sin(t); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
const rotX = t => { const c = Math.cos(t), s = Math.sin(t); return [1, 0, 0, 0, c, -s, 0, s, c]; };
const rotZ = t => { const c = Math.cos(t), s = Math.sin(t); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
function rotAxis(x, y, z, t) {                       // rotación de t radianes alrededor del eje (x,y,z) unitario
  const c = Math.cos(t), s = Math.sin(t), k = 1 - c;
  return [c + x * x * k, x * y * k - z * s, x * z * k + y * s, y * x * k + z * s, c + y * y * k, y * z * k - x * s, z * x * k - y * s, z * y * k + x * s, c + z * z * k];
}

  let ax = m[0], ay = m[3], az = m[6], l = Math.hypot(ax, ay, az) || 1; ax /= l; ay /= l; az /= l;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ── Sprites: cada imagen de regalo se pre-dibuja una vez con su sombra ── */
const sprites = {};                 // url → { canvas, ready }
const SPR = 128;                    // resolución del sprite
function makeSprite(drawFn) {
  const c = document.createElement('canvas'); c.width = c.height = SPR;
  const x = c.getContext('2d');
  x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 8; x.shadowOffsetY = 4;
  drawFn(x);
  return c;
}
const fallback = makeSprite(x => {
  x.font = `${SPR * 0.72}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif`;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('🌹', SPR / 2, SPR / 2 + 4);
});
// shade 0 = adelante (normal), 1 y 2 = más atrás (más oscuros) — se pre-dibujan una vez
function shaded(src, shade) {
  if (!shade) return src;
  const c = document.createElement('canvas'); c.width = c.height = SPR;
  const x = c.getContext('2d');
  x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = `rgba(20,10,30,${shade * 0.2})`; x.fillRect(0, 0, SPR, SPR);
  return c;
}
const fallbackShades = [0, 1, 2].map(k => shaded(fallback, k));
// canto y reverso de la ficha (sin sombra, más oscuros) — se pre-dibujan una vez por regalo
function tint(drawFn, fill) {
  const c = document.createElement('canvas'); c.width = c.height = SPR;
  const x = c.getContext('2d'); drawFn(x);
  x.globalCompositeOperation = 'source-atop'; x.fillStyle = fill; x.fillRect(0, 0, SPR, SPR);
  return c;
}
const tokenParts = draw => ({ edge: tint(draw, 'rgba(45,25,10,.6)'), back: tint(draw, 'rgba(15,8,20,.35)') });
const fallbackToken = tokenParts(x => {
  x.font = `${SPR * 0.72}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif`;
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('🌹', SPR / 2, SPR / 2 + 4);
});
function getToken(url) { return url && sprites[url] && sprites[url].ready ? sprites[url].token : fallbackToken; }
function getSprite(url, shade = 0) {
  if (!url) return fallbackShades[shade];

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { const base = makeSprite(x => x.drawImage(img, 10, 8, SPR - 20, SPR - 20)); s.shades = [0, 1, 2].map(k => shaded(base, k));

// colores de cada regalo (para el "pop" de su color); si la imagen no lo permite, colores cálidos
const DEF_COLS = ['#ffd36b', '#ff6f91', '#ffffff', '#ff9ec4'];
const colorCache = {};
function giftColors(url) {
  const key = url || 'fallback';
  if (colorCache[key]) return colorCache[key];
  const spr = getSprite(url);
  if (url && !(sprites[url] && sprites[url].ready)) return DEF_COLS;
  try {
    const d = spr.getContext('2d').getImageData(0, 0, SPR, SPR).data, cols = [];
    for (let k = 0; k < 400 && cols.length < 6; k++) {
      const i = (((Math.random() * SPR) | 0) * SPR + ((Math.random() * SPR) | 0)) * 4;
      if (d[i + 3] > 200 && d[i] + d[i + 1] + d[i + 2] > 120) cols.push(`rgb(${d[i]},${d[i + 1]},${d[i + 2]})`);
    }
    colorCache[key] = cols.length >= 3 ? cols.concat(['#ffffff']) : DEF_COLS;

// granito de maíz (modo kernel)
const kernelSpr = (() => {
  const c = document.createElement('canvas'); c.width = c.height = SPR; const x = c.getContext('2d');
  x.translate(SPR / 2, SPR / 2); x.shadowColor = 'rgba(0,0,0,.4)'; x.shadowBlur = 6; x.shadowOffsetY = 3;
  const g = x.createRadialGradient(-12, -16, 4, 0, 0, 52); g.addColorStop(0, '#ffe39a'); g.addColorStop(0.55, '#f2b632'); g.addColorStop(1, '#c97f12');
  x.fillStyle = g; x.beginPath(); x.moveTo(0, -46); x.bezierCurveTo(36, -40, 40, 16, 0, 48); x.bezierCurveTo(-40, 16, -36, -40, 0, -46); x.fill();
  x.shadowBlur = 0; x.fillStyle = '#e9d9b0'; x.beginPath(); x.ellipse(0, 36, 12, 10, 0, 0, 7); x.fill();         // puntita
  x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.ellipse(-12, -20, 7, 12, -0.4, 0, 7); x.fill();         // brillo
  return c;
})();
// sombra suave de contacto (pre-dibujada)
const shadowSpr = (() => {
  const c = document.createElement('canvas'); c.width = 128; c.height = 32;
  const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 2, 64, 64, 64);
  g.addColorStop(0, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.scale(1, 0.25); x.fillRect(0, 0, 128, 128); return c;
})();

// brillo del regalo agarrado (pre-dibujado)
const glowSpr = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 10, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,230,150,.55)'); g.addColorStop(0.5, 'rgba(255,200,120,.22)'); g.addColorStop(1, 'rgba(255,200,120,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128); return c;
})();

/* ── Física: círculos que caen, chocan, ruedan y se apilan ── */
let bodies = [];
let parts = [];
const rings = [];                    // ondas de impacto

function sizeFor(coins) {
  const m = Math.min(CFG.maxSizeMult, 1 + 0.45 * Math.log10(Math.max(1, coins)));
  return W * CFG.baseSize * m * rand(0.9, 1.1);
}
function spawnOne(url, coins) {
  if (bodies.length >= CFG.maxItems) fadeOldest(3);
  const z = CFG.depth ? Math.random() : 0;                          // 0 = adelante, 1 = fondo
  const r = sizeFor(coins) * (1 - 0.35 * z);                        // lo del fondo se ve más chico
  const left = L() + r, right = R() - r;
  const cx = (left + right) / 2, spread = (right - left) / 2;
  const x = cx + (Math.random() + Math.random() - 1) * spread * 0.85;   // más al centro que a los bordes
  const b = {
    x, y: -r - rand(0, 40), vx: rand(-60, 60), vy: rand(80, 220),
    r, m: r * r, a: rand(0, 6.28), av: rand(-4, 4), z, shade: z < 0.34 ? 0 : z < 0.67 ? 1 : 2,
    url, coins, born: now(), rest: 0, sleep: false, fade: 0, landed: false, hits: 0, sq: 0, sqv: 0,
  };
  if (CFG.mode === 'lanzado') {                                     // sale desde abajo (el celular del espectador) hacia la escena
    const sx = W / 2 + rand(-0.28, 0.28) * W;
    b.throw = { t0: now(), dur: rand(750, 1000), sx, sy: H + r * 3, tx: x, ty: H * rand(0.3, 0.5), spin: rand(-14, 14), popAt: CFG.kernel ? rand(0.32, 0.5) : -1, popped: !CFG.kernel };
    b.x = sx; b.y = H + r * 3;
  }
  if (CFG.ficha3d === 'siempre') {                                   // ficha 3D desde el lanzamiento: gira como moneda
    const ang = rand(0, 6.28);
    b.T = rotAxis(Math.cos(ang), Math.sin(ang), 0, rand(0.2, 1.1));
    b.wy = rand(CFG.mode === 'lanzado' ? 9 : 5, CFG.mode === 'lanzado' ? 16 : 11) * (Math.random() < 0.5 ? -1 : 1);
    b.wx = rand(-2.5, 2.5);
  }
  bodies.push(b);
  wake();
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function updateThrows(tn) {
  for (const b of bodies) {
    const T = b.throw; if (!T) continue;
    const t = Math.min(1, (tn - T.t0) / T.dur), e = easeOut(t);
    const px = b.x, py = b.y;
    b.x = T.sx + (T.tx - T.sx) * e;
    b.y = T.sy + (T.ty - T.sy) * e - H * 0.16 * Math.sin(Math.PI * t);   // arco
    b.a += T.spin * (1 - t) * 0.016;
    b.vis = 1 + 2.4 * (1 - e);                                       // cerca de la cámara = enorme, se aleja = normal

      T.popped = true; T.popT = tn;
      puff(b.x, b.y, b.r * b.vis, giftColors(b.url), 16, true);

    if (t >= 1) {                                                    // llegó a la escena: ahora cae con física
      b.throw = null; b.vis = 1;

function fadeOldest(n) {
  bodies.filter(b => !b.fade && !b.held).sort((a, b) => a.born - b.born).slice(0, n).forEach(b => b.fade = now());
}

function step(dt) {
  const g = CFG.gravity, left = L(), right = R();
  for (const b of bodies) {
    if (b.held) {                                                   // en la mano: sigue al puño (sin gravedad) y empuja a los demás
      const h = b.held, f = Math.pow(0.0005, dt);
      b.hx *= f; b.hy *= f;                                          // se centra en el puño
      const tx = h.x + h.vx * 0.04 + b.hx, ty = h.y + h.vy * 0.04 + b.hy;
      b.vx = (tx - b.x) * 22; b.vy = (ty - b.y) * 22;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.rel) b.av = 0; else { b.av = b.av * 0.9 + b.vx / b.r * 0.004; b.a += b.av * dt; }   // con ficha 3D gira con tu mano

  const cell = W * CFG.baseSize * CFG.maxSizeMult * 2, grid = new Map();
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i]; if (b.fade || b.throw) continue;
    const k = Math.floor(b.x / cell) + ',' + Math.floor(b.y / cell);
    (grid.get(k) || grid.set(k, []).get(k)).push(i);
  }
  for (let it = 0; it < 3; it++) {

          const b = bodies[j]; if (b.fade || b.throw || (a.sleep && b.sleep)) continue;

/* ── Ficha 3D: giro, asentarse en la pila, seguir la rotación de la mano ── */

  if (b.wx || b.wy) {

    const damp = b.throw ? 1 : Math.pow(settled ? 0.04 : 0.7, dt);

  const f0 = (c * T[1] - s * T[4]) * r, f1 = (s * T[1] + c * T[4]) * r;       // eje y

  const len = Math.hypot(dx, dy), layers = len < 0.7 ? 0 : Math.min(16, Math.ceil(len / (1.1 + 2 * Math.abs(T[8]))));   // de canto: más capas (sin rayas)

/* ── Chispas al caer ── */
const SPARK = ['#ffd36b', '#ff6f91', '#ffffff', '#ff9ec4', '#ffe9a8'];

}

/* ── Bucle (se detiene solo cuando no hay nada moviéndose) ── */

/* ── Regalos: combos en tiempo real (caen mientras el combo sigue) ── */

  streaks[key] = Math.max(done, totalSoFar);

window.spawnGift = (url, count = 1, coins = 1) => dropGift('test' + Math.random(), 'prueba', url, coins, count, true);


/* ════════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════════ */

  const zs = camRect().w, P = i => [S[i][0], S[i][1], -(L[i].z || 0) * zs];

  const u = [p9[0] - p0[0], p9[1] - p0[1], p9[2] - p0[2]], a = [p5[0] - p17[0], p5[1] - p17[1], p5[2] - p17[2]];
  return { x, y, size, fist: curled >= CFG.fistFingers, open: curled <= 1, pts: S, u, a };
}
// seguimiento de cada mano entre cuadros + estados con confirmación
function updateHands(found, t) {
  const used = new Set();
  for (const m of found) {
    let best = null, bd = Infinity;
    for (const h of HANDS.list) {
      if (used.has(h)) continue;
      const dd = Math.hypot(h.x - m.x, h.y - m.y);
      if (dd < bd && dd < Math.max(m.size, h.size) * 4) { bd = dd; best = h; }
    }
    if (!best) { best = { id: HANDS.nextId++, x: m.x, y: m.y, vx: 0, vy: 0, fist: false, fistN: 0, openN: 0, armed: false, held: null, hist: [] }; HANDS.list.push(best); }
    used.add(best);
    Object.assign(best, { x: m.x, y: m.y, size: m.size, pts: m.pts, seen: t });
    if (m.R) best.R = m.R;                                           // mouse: rotación con la rueda
    else if (m.u) {                                                  // cámara: suaviza y arma la orientación de la mano
      const mix = (o, v) => o ? o.map((q, i) => q + (v[i] - q) * 0.5) : v.slice();
      best.u = mix(best.u, m.u); best.a = mix(best.a, m.a); best.R = handFrame(best.u, best.a);
    }
    best.hist.push({ t, x: m.x, y: m.y });
    while (best.hist.length > 2 && t - best.hist[0].t > 160) best.hist.shift();
    const h0 = best.hist[0], dt = (t - h0.t) / 1000;              // velocidad de la mano (para lanzar)
    if (dt > 0.02) { best.vx = (m.x - h0.x) / dt; best.vy = (m.y - h0.y) / dt; }
    if (m.fist) { best.fistN++; best.openN = 0; } else if (m.open) { best.openN++; best.fistN = 0; } else { best.fistN = best.openN = 0; }
    if (!best.fist && best.fistN >= CFG.confirmFrames) { best.fist = true; if (best.armed) grabWith(best); best.armed = false; }
    else if (best.fist && best.openN >= CFG.confirmFrames) { best.fist = false; releaseFrom(best); }
    if (!best.fist && best.openN >= CFG.confirmFrames) best.armed = true;   // hay que ver la mano abierta antes de un puño
  }
  for (let i = HANDS.list.length - 1; i >= 0; i--) {
    const h = HANDS.list[i];
    if (!used.has(h) && t - h.seen > CFG.lostMs) { releaseFrom(h, true); HANDS.list.splice(i, 1); }
  }
  if (HANDS.list.some(h => h.held) || CFG.debug) wake();
}
function handFrame(u, a) {
  let l = Math.hypot(u[0], u[1], u[2]) || 1; const ux = u[0] / l, uy = u[1] / l, uz = u[2] / l;
  let wx = uy * a[2] - uz * a[1], wy = uz * a[0] - ux * a[2], wz = ux * a[1] - uy * a[0];
  l = Math.hypot(wx, wy, wz); if (l < 1e-6) return null; wx /= l; wy /= l; wz /= l;
  const ex = uy * wz - uz * wy, ey = uz * wx - ux * wz, ez = ux * wy - uy * wx;
  return [ex, ux, wx, ey, uy, wy, ez, uz, wz];
}
function grabWith(h) {
  const R = h.size * CFG.grabRadius;
  let best = null, bs = -Infinity;
  for (const b of bodies) {
    if (b.throw || b.fade || b.held) continue;
    const dd = Math.hypot(b.x - h.x, b.y - h.y);
    if (dd > R + b.r * 0.5) continue;
    const s = (b.coins >= CFG.bigGiftCoins ? 1e6 : 0) - dd;        // primero los grandes; entre iguales, el más cercano
    if (s > bs) { bs = s; best = b; }
  }
  h.lastTry = { t: now(), ok: !!best };
  if (!best) return;
  h.held = best; best.held = h;
  if (F3D()) {                                                       // pasa a ficha 3D y queda "pegada" a la orientación de tu mano
    best.T = mmul(rotZ(best.a), best.T || IDM()); best.a = 0; best.av = 0; best.wx = best.wy = 0;
    best.rel = h.R ? mmul(mT(h.R), best.T) : null;
  }
  Object.assign(best, { sleep: false, rest: 0, landed: true, hits: 0, shade: 0, hx: best.x - h.x, hy: best.y - h.y });
  best.sqv -= 3;                                                     // se estira un poco al levantarlo
  for (const n of bodies) if (n !== best && Math.hypot(n.x - best.x, n.y - best.y) < best.r * 4) { n.sleep = false; n.rest = 0; }   // la pila se acomoda
  puff(best.x, best.y, best.r * 0.8, giftColors(best.url), 6, false);
  wake();
}
function releaseFrom(h, lost) {
  const b = h.held; if (!b) return;
  h.held = null; b.held = null;
  let vx = lost ? 0 : h.vx * CFG.throwMult, vy = lost ? 0 : h.vy * CFG.throwMult;
  const sp = Math.hypot(vx, vy), mx = 2600; if (sp > mx) { vx *= mx / sp; vy *= mx / sp; }
  Object.assign(b, { vx, vy, landed: false, hits: 0, sleep: false, rest: 0, born: now(), pvy: vy });
  b.av += vx / b.r * 0.25;
  b.rel = null;
  if (F3D() && b.T) { b.av = 0; b.wy = clamp(vx / b.r * 0.05, -14, 14); b.wx = clamp(-vy / b.r * 0.03, -9, 9); }   // al lanzarla sigue girando
  wake();
}
function drawHandsDebug(tn) {
  ctx.font = '12px system-ui, sans-serif'; ctx.textBaseline = 'top';
  for (const h of HANDS.list) {
    if (h.pts) { ctx.fillStyle = '#7df9ff'; for (const [x, y] of h.pts) { ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill(); } }
    ctx.strokeStyle = h.fist ? (h.held ? '#5dff7a' : '#ffd36b') : '#ffffff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.size * CFG.grabRadius, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    const txt = h.held ? 'agarrando ' + (h.held.coins >= CFG.bigGiftCoins ? '(grande)' : '') : h.fist ? (h.lastTry && !h.lastTry.ok ? 'puño (nada cerca)' : 'puño') : h.armed ? 'abierta' : '…';
    ctx.fillText(txt, h.x + 8, h.y + h.size * CFG.grabRadius + 4);
  }
  const st = `manos: ${HANDS.list.length} · ${HANDS.fps} fps · ${HANDS.status}`;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(6, 6, Math.min(W - 12, ctx.measureText(st).width + 12), 20);
  ctx.fillStyle = '#fff'; ctx.fillText(st, 12, 10, W - 24);
}
async function openCamera() {              // misma idea que live-fx (no abre la webcam física si no hace falta)
  const C = { width: { ideal: 1280 }, height: { ideal: 1280 }, frameRate: { ideal: 30 }, resizeMode: { ideal: 'none' } };   // sin recortar: respeta la cámara vertical de OBS
  const gum = id => navigator.mediaDevices.getUserMedia({ video: id ? { ...C, deviceId: { exact: id } } : C });
  const list = async () => (await navigator.mediaDevices.enumerateDevices()).filter(x => x.kind === 'videoinput');
  const low = c => (c.label || '').toLowerCase();
  const okLabel = l => (!CFG.camname || l.includes(CFG.camname)) && !(CFG.camAvoid && l.includes(CFG.camAvoid));
  const pick = cams => cams.find(c => okLabel(low(c)))                                         // la que pediste
    || (CFG.camAvoid && cams.find(c => !low(c).includes(CFG.camAvoid)))                           // cualquiera que no sea la evitada
    || cams[CFG.cam] || cams[0];
  const KEY = 'regalos-cam-' + (CFG.camname || CFG.cam) + (CFG.camAvoid ? '-sin-' + CFG.camAvoid : '');
  const remember = s => { const tr = s.getVideoTracks()[0]; HANDS.label = tr?.label || '?'; try { localStorage.setItem(KEY, tr.getSettings().deviceId || ''); } catch {} return s; };
  const labelOf = s => (s.getVideoTracks()[0]?.label || '').toLowerCase();
  let cams = await list();
  if (!cams.some(c => c.label)) {          // el navegador aún no muestra los nombres
    let saved = null; try { saved = localStorage.getItem(KEY); } catch {}
    if (saved) { try { const s = await gum(saved); if (okLabel(labelOf(s))) return remember(s); s.getTracks().forEach(t => t.stop()); } catch (e) { console.warn('cámara recordada falló', e); } }
    try {
      const s = await gum(null);
      if (okLabel(labelOf(s))) return remember(s);
      s.getTracks().forEach(t => t.stop());
    } catch (e) { if (e.name === 'NotAllowedError') throw new Error('permiso de cámara negado'); }
    cams = await list();
  }
  const c = pick(cams); if (!c) throw new Error('no encontré ninguna cámara');
  try { return remember(await gum(c.deviceId)); }
  catch (e) { throw new Error(`no pude abrir "${c.label || 'la cámara'}" (${e.name === 'NotReadableError' ? 'la está usando otro programa' : e.message})`); }
}
// muestra la cámara de fondo (vista previa), también girada
function placeVideo() {
  if (!video.parentNode) return;
  const rot = CFG.rotate === 90 || CFG.rotate === 270;
  Object.assign(video.style, { position: 'fixed', left: '50%', top: '50%', width: (rot ? H : W) + 'px', height: (rot ? W : H) + 'px',
    objectFit: CFG.fit, zIndex: '-1', transform: `translate(-50%,-50%) ${CFG.mirror ? 'scaleX(-1) ' : ''}rotate(${CFG.rotate}deg)` });
}
addEventListener('resize', placeVideo);
async function startHands() {
  try {
    HANDS.status = 'cargando modelo…';
    const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const { FilesetResolver, HandLandmarker } = await import(`${base}/vision_bundle.mjs`);
    const fileset = await FilesetResolver.forVisionTasks(`${base}/wasm`);
    const make = delegate => HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate },
      runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('este navegador no permite la cámara aquí (abre el archivo en Chrome)');
    let model; try { model = await make('GPU'); } catch (e) { console.warn('GPU no disponible, CPU', e); model = await make('CPU'); }
    HANDS.status = 'abriendo cámara…';
    video.srcObject = await openCamera(); await video.play();
    if (HANDS.label.toLowerCase().includes('obs') && !CFG.rotateSet)                               // cámara de OBS: horizontal → se gira · vertical (ya girada en OBS) → no
      CFG.rotate = video.videoWidth > video.videoHeight ? CFG.obsRotate : 0;
    if (CFG.showCam) { document.body.style.background = '#111'; document.body.prepend(video); placeVideo(); }   // cámara de fondo (para probar en el navegador)
    HANDS.status = `${HANDS.label} ${video.videoWidth}×${video.videoHeight}` + (CFG.rotate ? ` · girada ${CFG.rotate}°` : '');
    console.log('[Regalos] mano lista con cámara:', HANDS.label);
    let lastVT = -1, lastT = 0, frames = 0, fpsT = performance.now();
    const tick = () => {
      const t = performance.now();
      if (video.readyState >= 2 && video.currentTime !== lastVT && t - lastT >= 1000 / CFG.handFps - 4) {
        lastVT = video.currentTime; lastT = t;
        const f = grabFrame(); if (CFG.debug) HANDS.frame = f;
        const res = model.detectForVideo(f, t);
        updateHands((res.landmarks || []).map(handFromLandmarks), now());
        frames++; if (t - fpsT > 1000) { HANDS.fps = frames; frames = 0; fpsT = t; }
      }
      if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(tick); else setTimeout(tick, 1000 / CFG.handFps);
    };
    tick();
  } catch (e) {
    console.error('[Regalos] mano:', e); HANDS.status = '⚠ ' + e.message; CFG.debug = true;
    if (!CFG.mouse) { CFG.mouse = true; startMouse(); HANDS.status += ' · prueba con el mouse'; }
    wake();
  }
}
/* ── manos=1: recibir las manos desde manos.html (UN solo detector, abierto en Chrome, fuera de TikTok) ──
   Llegan por: evento "manos" de OBS (fuentes de navegador de OBS, sin contraseña) · WebSocket de OBS
   (Live Studio: agregar #obspass=… al final del enlace) · BroadcastChannel (pestañas del mismo Chrome).
   Las coordenadas vienen enderezadas (rotate lo hace manos.html); w×h = tamaño del cuadro analizado. */
function listenManos(onPkt) {
  const P = new URLSearchParams(location.search), HP = new URLSearchParams(location.hash.slice(1));
  const pass = HP.get('obspass') || P.get('obspass') || '', url = P.get('obs') || 'ws://localhost:4455';
  const st = { obs: 'no usado', via: '—', n: 0, age: Infinity, w: 0, h: 0 };
  let S = '', N = 0, lastAt = 0, stale = true;
  const pts = (a, k) => { const L = []; for (let i = 0; i < a.length; i += 3) L.push({ x: a[i], y: a[i + 1], [k]: a[i + 2] }); return L; };
  const take = (d, via) => {
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch { return; } }
    if (d && typeof d.j === 'string') { try { d = JSON.parse(d.j); } catch { return; } }   // manos.html lo manda como texto
    if (!d || typeof d !== 'object' || !d.w) return;
    if (d.s === S && d.n <= N) return;                     // el mismo paquete llega por dos caminos
    S = d.s; N = d.n; lastAt = performance.now(); stale = false; st.n++; st.via = via; st.w = d.w; st.h = d.h;
    const pkt = { w: d.w, h: d.h, t: lastAt };
    if (d.hands) { pkt.hands = d.hands.map(a => pts(a, 'z')); pkt.handedness = (d.hd || []).map(c => [{ categoryName: c }]); }
    if ('pose' in d) pkt.pose = d.pose ? pts(d.pose, 'visibility') : null;
    onPkt(pkt);
  };
  addEventListener('manos', e => take(e.detail, 'OBS'));
  try { new BroadcastChannel('manos').onmessage = e => take(e.data, 'Chrome'); } catch {}
  setInterval(() => {                                       // manos.html se cerró o se trabó: soltar todo
    st.age = performance.now() - lastAt;
    if (!stale && st.age > 700) { stale = true; onPkt({ w: st.w, h: st.h, t: performance.now(), hands: [], handedness: [], pose: null, stale: true }); }
  }, 250);
  if (window.obsstudio && !pass && !P.get('obs')) { st.obs = 'no hace falta (dentro de OBS)'; return st; }
  const sha = async s => btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))));
  const connect = () => {
    let ws; try { ws = new WebSocket(url); } catch { st.obs = 'dirección inválida'; return; }
    if (!/contraseña/.test(st.obs)) st.obs = 'conectando…';
    ws.onmessage = async m => {
      let msg; try { msg = JSON.parse(m.data); } catch { return; }
      if (msg.op === 0) {
        const d = { rpcVersion: 1, eventSubscriptions: 1 }, au = msg.d.authentication;     // 1 = eventos generales (CustomEvent)
        if (au) { if (!pass) { st.obs = 'OBS pide contraseña: agrega #obspass=… al final del enlace'; ws.close(); return; }
          d.authentication = await sha(await sha(pass + au.salt) + au.challenge); }
        ws.send(JSON.stringify({ op: 1, d }));
      } else if (msg.op === 2) st.obs = 'conectado ✓';
      else if (msg.op === 5 && msg.d?.eventType === 'CustomEvent' && msg.d.eventData?.manos) take(msg.d.eventData.manos, 'WebSocket');
    };
    ws.onclose = e => { if (e.code === 4009) st.obs = 'contraseña incorrecta'; else if (!/contraseña/.test(st.obs)) st.obs = 'sin conexión (¿OBS abierto?)'; setTimeout(connect, 3000); };
    ws.onerror = () => {};
  };
  connect();
  return st;
}

function startManos() {                    // sin cámara ni modelo: los puntos llegan de manos.html
  CFG.rotate = 0; HANDS.label = 'manos.html';
  const dims = { w: 0, h: 0 };
  Object.defineProperty(video, 'videoWidth', { get: () => dims.w || 720 });
  Object.defineProperty(video, 'videoHeight', { get: () => dims.h || 1280 });
  let frames = 0, fpsT = now();
  const st = listenManos(pkt => {
    if (!pkt.hands) return;                                // paquete solo de cuerpo
    dims.w = pkt.w; dims.h = pkt.h;
    updateHands(pkt.hands.map(handFromLandmarks), now());
    frames++; const t = now(); if (t - fpsT > 1000) { HANDS.fps = frames; frames = 0; fpsT = t; }
  });
  setInterval(() => { HANDS.status = st.age < 1000 ? `manos.html ✓ (por ${st.via})` : `esperando a manos.html… · WebSocket: ${st.obs}`; if (CFG.debug) wake(); }, 500);
}
if (CFG.hands && CFG.manos) startManos();
else if (CFG.hands) startHands();
if (CFG.mouse) startMouse();
function startMouse() {                    // prueba con el mouse: mantener clic = puño
  let mx = -1, my = -1, down = false, yaw = 0, roll = 0;
  addEventListener('wheel', e => { if (e.shiftKey) roll += e.deltaY * 0.004; else yaw += e.deltaY * 0.004; }, { passive: true });   // rueda = girar la "mano"
  addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
  addEventListener('pointerdown', e => { mx = e.clientX; my = e.clientY; down = true; });
  addEventListener('pointerup', () => { down = false; });
  document.documentElement.style.cursor = 'crosshair';
  setInterval(() => { if (mx >= 0) updateHands([{ x: mx, y: my, size: W * 0.07, fist: down, open: !down, R: mmul(rotZ(roll), rotY(yaw)) }], now()); }, 33);
  if (!CFG.hands) HANDS.status = 'mouse: mantén clic para agarrar · rueda = girar (Shift = inclinar)';
}
window.__hands = { feed: (list) => updateHands(list, now()), fromLandmarks: handFromLandmarks, get list() { return HANDS.list; } };   // para pruebas

/* ── TikFinity ── */
let ws, reconnectTimer;
function connect() {
  try { ws = new WebSocket(CFG.wsUrl); } catch (e) { return scheduleReconnect(); }
  ws.onopen = () => { clearTimeout(reconnectTimer); console.log('[Regalos] Conectado a TikFinity'); };
  ws.onmessage = evt => {
    if (evt.data.indexOf('"gift"') === -1) return;                    // solo regalos: ni se leen los demás eventos
    let msg; try { msg = JSON.parse(evt.data); } catch { return; }
    if (msg.event !== 'gift') return;
    const d = msg.data || {};
    const giftId = d.giftId ?? d.gift?.gift_id ?? d.giftName ?? '?';
    const uid = d.uniqueId || d.userId || '?';
    const count = parseInt(d.repeatCount || d.gift?.repeat_count || 1, 10);
    const coins = parseInt(d.diamondCount ?? d.gift?.diamond_count ?? 1, 10) || 1;
    const ended = d.repeatEnd !== false;
    dropGift(uid + '|' + giftId, d.nickname || uid, d.giftPictureUrl || '', coins, count, ended);
  };
  ws.onerror = () => {};
  ws.onclose = () => scheduleReconnect();
}
function scheduleReconnect() { clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connect, 5000); }

/* ── Pruebas: tecla R lanza rosas; ?demo=1 simula un live ── */
const REPO = 'https://raw.githubusercontent.com/srdwly/testoverlay/main/img/';
const DEMO_GIFTS = [[null, 1], [REPO + 'sombrero.png', 99], [REPO + 'amplificado.png', 249], [REPO + 'galaxia.png', 1000]];
addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') dropGift('k' + Math.random(), 'Prueba', null, 1, 10, true); });
if (new URLSearchParams(location.search).get('demo') === '1') {
  const names = ['Andrea', 'Lokito', 'Sumo', 'Luz', 'Marco', 'Kathy'];
  setInterval(() => {
    const r = Math.random(), nm = names[(Math.random() * names.length) | 0];
    const [url, coins] = r < 0.8 ? DEMO_GIFTS[0] : DEMO_GIFTS[1 + ((Math.random() * 3) | 0)];
    const key = nm + url, total = coins === 1 ? 5 + ((Math.random() * 20) | 0) : 1;
    let n = 0;                                                         // simula un combo que va subiendo
    const tick = setInterval(() => { n = Math.min(total, n + 3); dropGift(key, nm, url, coins, n, n >= total); if (n >= total) clearInterval(tick); }, 300);
  }, 2600);
}

resize();
connect();
