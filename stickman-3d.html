<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickman 3D</title>
<script>
/* ════════════════════════════════════════════════════════════════
   STICKMAN 3D — laboratorio de bailes (todavía NO está en ningún overlay).

   Esqueleto 3D con volumen (huesos redondeados, sombreado tipo caricatura y borde negro).
   Manos y pies van a un punto exacto con IK de dos huesos: los pies se quedan plantados
   en el piso aunque el cuerpo baje, y al saltar las piernas cuelgan solas.

   Movimiento con los principios clásicos de animación:
     · superposición y seguimiento: la cadera manda, el pecho, los brazos y la cabeza llegan un
       poquito después y con un pequeño rebote (resortes), así nada se mueve "en bloque"
     · aplastar y estirar: el cuerpo se comprime al tomar impulso y al caer, y se estira en el aire
     · anticipación: se agachan antes de saltar, se tuercen al revés antes de girar, el robot
       "carga" antes de cada golpe
     · arcos: brazos y manos viajan en curvas, no en línea recta
     · entradas y salidas suaves, y cambio de baile mezclado durante un tiempo entero
     · acción secundaria: capa de tela, puntas de la bandana y púa de la cadena se mueven solas

   Bailes (todos al mismo pulso, ?bpm=100):
     paso básico, cumbia, caporal, robot, disco, running man, moonwalk,
     guitarra al aire, floss, manos arriba, giro, salto con aplauso.

   Niveles (iguales a la pista de baile; cada nivel suma lo anterior):
     2 bandana · 3 lentes · 4 sombrero · 5 capa · 6 cadena de oro con púa · 7 fuego en los pies
     · 8 aura · 9 cuerpo dorado y aureola · 10 LEYENDA (arcoíris, aura de colores y foco propio)

   ENLACE: stickman-3d.html          → 5 bailando juntos; cambian de baile cada 8 tiempos
     ?galeria=1        todos los bailes a la vez, cada uno en su cuadro (vista de 3/4)
     ?galeria=niveles  los 9 niveles con accesorios, cada uno bailando
     ?n=5         cuántos stickmans (1 a 8)
     ?nivel=7     todos con ese nivel (sin esto, cada uno muestra un nivel distinto)
     ?baile=cumbia  fija un baile · ?mezcla=1 cada uno baila algo distinto
     ?bpm=100     velocidad · ?panel=0 sin botones · ?fondo=1 fondo oscuro
     ?escala=1    tamaño · ?altura=3 cámara más arriba (más vista desde arriba)

   Usa three.js desde cdn.jsdelivr.net (como MediaPipe en los otros overlays).
   ════════════════════════════════════════════════════════════════ */
</script>

  body.fondo { background: linear-gradient(#36475a, #161c24); }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #gl, #ui { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  #panel button { font: 700 24px system-ui, Arial; padding: 10px 16px; border-radius: 14px; border: 0; background: rgba(20,20,30,.75); color: #fff; cursor: pointer; }
  #panel button.on, #panel button:hover { background: #e3122b; }
  #panel .sep { flex-basis: 100%; height: 0; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }</script>

<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="ui"></canvas><div id="panel"></div></div>
<script type="module">
import * as THREE from 'three';

const Q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; };
if (Q.get('fondo') === '1') document.body.classList.add('fondo');
const W = 1080, H = 1920, GMODE = Q.get('galeria'), GAL = GMODE === '1' || GMODE === 'niveles';
const PSCALE = GAL ? 0.25 : 1;                 // el tamaño de las partículas va en píxeles de pantalla: en la galería los cuadros están más cerca
const stage = document.getElementById('stage');
function fit() { stage.style.transform = `scale(${innerWidth / 1080})`; }
addEventListener('resize', fit); fit();

const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const fr = x => x - Math.floor(x);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
const easeOut = t => 1 - (1 - t) ** 3;
const backOut = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const onBeat = b => (1 + Math.cos(TAU * b)) / 2;              // 1 justo en el tiempo, 0 entre tiempos
const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
// mano que viaja en ARCO: además de ir de a a b, se abomba hacia "bulge" a mitad de camino
const arc3 = (a, b, t, bulge) => { const s = Math.sin(PI * clamp(t, 0, 1)); const o = lerp3(a, b, t); return [o[0] + bulge[0] * s, o[1] + bulge[1] * s, o[2] + bulge[2] * s]; };
// salto con física: sube rápido y cae como con gravedad (parábola)
const para = q => 4 * q * (1 - q);

/* ════════════════ MEDIDAS (en metros, más o menos) ════════════════ */
const L1 = 0.46, L2 = 0.46, SPINE = 0.5, NECK = 0.09, HEADR = 0.17, UA = 0.3, FA = 0.29, SHW = 0.16, HPW = 0.095, STAND = 0.9, ANK = 0.05;
const BPM = num('bpm', 100), BPS = BPM / 60;

/* ════════════════ POSE ════════════════
   Todo se mide desde el piso, mirando hacia +z (hacia la cámara). "Afuera" = hacia el lado de ese brazo/pierna.
     mx, mz     mover todo el cuerpo por el piso          yaw   girar todo el cuerpo
     px py pz   cadera (py = cuánto baja/sube)           hipYaw, hipRoll  cadera girada / ladeada
     lean       espalda hacia adelante                    roll  espalda ladeada · twist  hombros girados
     nod turn tilt   cabeza (asentir, girar, ladear)
     hL hR      mano [afuera, arriba, adelante] desde el hombro, en el marco del pecho
     fL fR      pie [afuera, alto, adelante] desde el centro, en el marco del cuerpo
     pL pR      hacia dónde apunta el codo (opcional)
     guitar     1 = con guitarra (las manos se van solas al mástil y a las cuerdas)
     strum      mano que rasguea (-1 abajo … 1 arriba) · fret  mano del mástil (0 cerca … 1 lejos)
     sq         aplastar (+) / estirar (−); lo calcula solo la capa de movimiento            */
function base() {
  return { mx: 0, mz: 0, yaw: 0, px: 0, py: 0, pz: 0, hipYaw: 0, hipRoll: 0, lean: 0.04, roll: 0, twist: 0, nod: 0, turn: 0, tilt: 0,
    hL: [0.05, -0.56, 0.06], hR: [0.05, -0.56, 0.06], fL: [0.11, 0, 0.02], fR: [0.11, 0, 0.02], pL: null, pR: null, guitar: 0, strum: 0, fret: 0.5, sq: 0, wind: 0, windPh: 0, flip: 0 };
}
const NUMK = ['mx', 'mz', 'yaw', 'px', 'py', 'pz', 'hipYaw', 'hipRoll', 'lean', 'roll', 'twist', 'nod', 'turn', 'tilt', 'guitar', 'strum', 'fret', 'sq', 'wind', 'windPh', 'flip'];
const ARRK = ['hL', 'hR', 'fL', 'fR'];
function mixPose(A, B, t) {
  const o = base();
  for (const k of NUMK) o[k] = lerp(A[k], B[k], t);
  for (const k of ARRK) o[k] = lerp3(A[k], B[k], t);
  for (const k of ['pL', 'pR']) o[k] = A[k] && B[k] ? lerp3(A[k], B[k], t) : (t < 0.5 ? A[k] : B[k]);
  return o;
}
// pies con x absoluta (centro del cuerpo): izquierda = +x
function feetAbs(p, lx, rx, ly = 0, ry = 0, lz = 0.02, rz = 0.02) { p.fL = [lx, ly, lz]; p.fR = [-rx, ry, rz]; }
// paso a un lado y junta (4 tiempos): devuelve x de cada pie, el centro y cuál pie se levanta.
// El pie viaja en arco (sube en el medio) y el centro del cuerpo lo sigue un poco después.
function stepTouch(b, w) {
  const i = Math.floor(b) % 4, s = fr(b), e = ease(s), lift = 0.08 * Math.sin(PI * s);
  let L, R, lL = 0, lR = 0;
  if (i === 0) { L = lerp(-w + 0.11, w + 0.11, e); R = -w - 0.11; lL = lift; }
  else if (i === 1) { L = w + 0.11; R = lerp(-w - 0.11, w - 0.11, e); lR = lift; }
  else if (i === 2) { L = w + 0.11; R = lerp(w - 0.11, -w - 0.11, e); lR = lift; }
  else { L = lerp(w + 0.11, -w + 0.11, e); R = -w - 0.11; lL = lift; }
  const c = w * Math.sin(PI * (b - 0.35) / 2) * 0.9;          // el peso se mueve en curva suave, no a saltos
  return { L, R, lL, lR, c };
}
// brazo que gira en un círculo frente/atrás del hombro (ángulo 0 = colgando, + = adelante/arriba)
const swingArm = (th, out = 0.2, r = 0.55) => [out, -r * Math.cos(th), r * Math.sin(th)];

/* ════════════════ BAILES ════════════════ */
const ROBOT = [
  { hL: [0.08, -0.3, 0.3], hR: [0.08, -0.3, 0.3] },
  { hL: [0.3, 0.28, 0.02], hR: [0.08, -0.3, 0.3], turn: 0.7 },
  { hL: [0.08, -0.3, 0.3], hR: [0.3, 0.28, 0.02], turn: -0.7 },
  { hL: [0.55, 0.0, 0.05], hR: [0.55, 0.0, 0.05], py: -0.1, nod: 0.25 },
  { hL: [0.04, -0.02, 0.57], hR: [0.04, -0.02, 0.57], yaw: 0.8, turn: -0.8 },
  { hL: [0.04, -0.02, 0.57], hR: [0.3, 0.28, 0.02], yaw: 0.8, turn: -0.8, tilt: 0.35 },
  { hL: [0.3, -0.3, 0.0], hR: [0.3, 0.28, 0.02], yaw: -0.8, turn: 0.8, twist: 0.2 },
  { hL: [0.3, 0.28, 0.02], hR: [0.3, 0.28, 0.02], py: -0.16, nod: -0.25 },
].map(k => Object.assign(base(), { lean: 0, fL: [0.17, 0, 0.02], fR: [0.17, 0, 0.02] }, k));
function mixInto(p, A, B, t) { for (const k of NUMK) p[k] = lerp(A[k], B[k], t); for (const k of ARRK) p[k] = lerp3(A[k], B[k], t); return p; }

const DANCE = {
  basico(b) {
    const p = base(), d = onBeat(b), sw = Math.sin(PI * b), st = stepTouch(b, 0.14);
    feetAbs(p, st.L, st.R, st.lL, st.lR); p.px = st.c;
    p.py = -0.08 * d; p.nod = 0.13 * d - 0.04; p.roll = -0.07 * sw; p.twist = 0.16 * sw; p.hipRoll = 0.06 * sw;
    const up = Math.max(0, sw), dn = Math.max(0, -sw);                         // la mano que va adelante sube en arco
    p.hL = [0.1 + 0.03 * up, -0.4 + 0.05 * d + 0.08 * up, 0.18 + 0.14 * sw]; p.hR = [0.1 + 0.03 * dn, -0.4 + 0.05 * d + 0.08 * dn, 0.18 - 0.14 * sw];
    return p;
  },
  cumbia(b) {
    const p = base(), i = Math.floor(b) % 4, s = fr(b), e = ease(s), d = onBeat(b);
    const kL = i === 0 ? e : i === 1 ? 1 - e : 0, kR = i === 2 ? e : i === 3 ? 1 - e : 0, up = 0.07 * Math.sin(PI * s);
    p.fL = [0.13 + 0.03 * kL, i < 2 ? up : 0, 0.04 - 0.3 * kL]; p.fR = [0.13 + 0.03 * kR, i >= 2 ? up : 0, 0.04 - 0.3 * kR];
    p.hipYaw = 0.32 * (kL - kR); p.twist = -0.22 * (kL - kR); p.py = -0.1 - 0.05 * d; p.hipRoll = 0.08 * Math.sin(PI * b / 2);
    p.yaw = 0.35 * Math.sin(TAU * b / 16); p.roll = 0.07 * Math.sin(PI * b); p.nod = 0.07 * d; p.tilt = 0.1 * Math.sin(PI * b / 2);
    const aL = kR - kL;                                                         // brazos en arco, contrarios al pie
    p.hL = [0.15 + 0.04 * Math.abs(aL), -0.3 + 0.04 * d + 0.05 * Math.max(0, aL), 0.22 + 0.14 * aL];
    p.hR = [0.15 + 0.04 * Math.abs(aL), -0.3 + 0.04 * d + 0.05 * Math.max(0, -aL), 0.22 - 0.14 * aL];
    return p;
  },
  caporal(b) {
    const p = base(), k = Math.floor(b) % 2, s = fr(b), h = para(s);
    p.py = -0.12 + 0.36 * h;                                                     // toca el piso agachado, vuela en parábola
    const knee = Math.sin(PI * clamp(s * 1.15, 0, 1));                            // la rodilla sube rápido y baja justo antes de caer
    const lifted = [0.11, 0.5 * knee, 0.3 * knee], stand = [0.11, 0, 0];
    p.fL = k ? stand : lifted; p.fR = k ? lifted : stand;
    p.hR = swingArm(0.8 + 1.35 * Math.sin(PI * b), 0.2); p.hL = swingArm(0.8 - 1.35 * Math.sin(PI * b), 0.2);   // brazos en círculo, opuestos a la rodilla
    p.lean = 0.1 - 0.22 * h; p.nod = 0.1 - 0.22 * h; p.twist = 0.22 * Math.sin(PI * b);
    p.yaw = 0.45 * Math.tanh(3 * Math.sin(PI * b / 4));
    const T = b % 16;                                                            // vuelta completa cada 16 tiempos (con anticipación)
    if (T > 13.5) p.yaw += -0.35 * sstep(13.5, 14, T) * (1 - sstep(14, 14.4, T)) + TAU * ease(clamp((T - 14) / 1.8, 0, 1));
    return p;
  },
  robot(b) {
    const i = Math.floor(b) % 8, s = fr(b), q = backOut(clamp(s / 0.2, 0, 1));
    const p = mixInto(base(), ROBOT[(i + 7) % 8], ROBOT[i], q);                // golpe seco con rebotito
    if (s > 0.8) { const a = mixInto(base(), ROBOT[i], ROBOT[(i + 1) % 8], -0.1 * sstep(0.8, 1, s)); mixInto(p, p, a, 1); }   // "carga" antes del siguiente
    p.py += -0.03 * onBeat(b); p.pL = [0.35, -0.3, -0.7];
    return p;
  },
  disco(b) {
    const p = base(), up = Math.floor(b) % 2 === 0, s = fr(b);
    const go = backOut(clamp(s / 0.32, 0, 1)), wind = s > 0.82 ? sstep(0.82, 1, s) : 0;
    const lo = [-0.14, -0.45, 0.26], hi = [0.34, 0.44, 0.22];
    let q = up ? go : 1 - go;
    q += up ? 0.1 * wind : -0.1 * wind;                                           // se prepara al revés antes de apuntar
    p.yaw = -0.3; p.hR = arc3(lo, hi, q, [0.06, -0.05, 0.16]);
    p.hL = [-0.01, -0.4, -0.02]; p.pL = [1, 0.1, -0.3];                         // mano en la cintura
    const c = clamp(q, -0.1, 1.1) * 2 - 1;
    p.hipRoll = -0.13 * c; p.px = 0.06 * c; p.roll = 0.09 * c;
    p.turn = -0.35 * q + 0.1; p.nod = -0.35 * q + 0.15; p.py = -0.06 * (1 - q) - 0.02;
    p.fL = [0.15, 0, 0.02]; p.fR = [0.11, 0.05 * clamp(q, 0, 1), 0.08];
    return p;
  },
  runningman(b) {
    const p = base(), k = Math.floor(b) % 2, s = fr(b);
    const up = [0.11, 0.4 * Math.sin(PI * s) ** 0.8, lerp(-0.35, 0.18, ease(s))], slide = [0.11, 0, lerp(0.18, -0.35, ease(s))];
    p.fL = k ? slide : up; p.fR = k ? up : slide;
    p.yaw = 0.55; p.lean = 0.14; p.py = -0.08 - 0.06 * Math.cos(TAU * s);
    const fw = Math.sin(PI * b);
    p.hL = swingArm(0.9 - 0.7 * fw, 0.12, 0.42); p.hR = swingArm(0.9 + 0.7 * fw, 0.12, 0.42);
    p.nod = 0.1 * onBeat(b); p.twist = -0.12 * fw;
    return p;
  },
  moonwalk(b) {
    const p = base(), T = b % 16, k = Math.floor(b) % 2, s = fr(b), rise = sstep(0, 0.25, s);
    const f = T < 7.5 ? 1 : T < 8.5 ? lerp(1, -1, ease(T - 7.5)) : T < 15.5 ? -1 : lerp(-1, 1, ease(T - 15.5));
    p.yaw = f * PI / 2;                                                        // de perfil; gira de frente al cambiar de lado
    p.mx = T < 8 ? 0.9 - 0.225 * T : -0.9 + 0.225 * (T - 8);                    // se desliza hacia atrás
    const flat = [0.07, 0.06 * (1 - rise), 0.12 - 0.24 * s], toe = [0.07, 0.06 * rise, -0.12 + 0.24 * s];
    p.fL = k ? toe : flat; p.fR = k ? flat : toe;
    const w = Math.sin(PI * b);
    p.py = -0.03 - 0.02 * onBeat(b); p.lean = 0.07; p.nod = 0.08 * w; p.hipRoll = 0.04 * w;
    p.hL = [0.06, -0.5, 0.1 + 0.12 * w]; p.hR = [0.06, -0.5, 0.1 - 0.12 * w];
    return p;
  },
  guitarra(b) {
    const p = base(), bang = onBeat(b) ** 2, T = b % 16;
    p.guitar = 1; p.yaw = 0.35;
    p.fL = [0.25, 0, 0.1]; p.fR = [0.25, 0, -0.06];
    p.py = -0.15 - 0.05 * bang; p.lean = 0.12 + 0.1 * bang; p.nod = 0.5 * bang - 0.12;
    p.strum = Math.sin(2 * TAU * b) * 0.9; p.fret = 0.5 + 0.25 * Math.sin(PI * b / 2);
    // MOLINO (como Pete Townshend): el brazo derecho da vueltas completas y golpea las cuerdas justo en el tiempo
    const wm = sstep(7.4, 8, T) * (1 - sstep(12, 12.4, T));
    if (wm > 0) {
      const s = fr(T), hit = Math.exp(-s * 8);
      p.wind = wm; p.windPh = TAU * Math.pow(s, 1.7);                             // sube lento, baja rápido
      p.py += (-0.08 - 0.1 * hit) * wm; p.lean += (0.12 * hit - 0.1) * wm; p.nod += 0.3 * hit * wm; p.strum = 0;
      p.fL[0] += 0.08 * wm; p.fR[0] += 0.08 * wm; p.yaw = lerp(0.35, 0.12, wm);
    }
    if (T > 13.5 && T < 15.8) {                                                   // salto de rockero: se agacha, vuela, cae y absorbe
      const pre = sstep(13.5, 14, T) * (1 - sstep(14, 14.15, T)), q = clamp((T - 14.1) / 1.2, 0, 1), air = T > 14.1 && T < 15.3 ? para(q) : 0;
      const land = T > 15.3 ? Math.sin(PI * clamp((T - 15.3) / 0.5, 0, 1)) : 0;
      p.py += -0.12 * pre + 0.55 * air - 0.1 * land; p.fL[1] += 0.12 * air; p.fR[1] += 0.18 * air; p.fL[2] -= 0.08 * air; p.fR[2] -= 0.1 * air;
      p.lean += 0.15 * pre - 0.22 * air + 0.12 * land; p.nod -= 0.35 * air;
    }
    return p;
  },
  floss(b) {
    const p = base(), side = -Math.cos(PI * b), c = Math.sin(PI * b), X = 0.34 * side;
    p.hL = [X - SHW, -0.5 + 0.04 * Math.abs(c), 0.2 * c]; p.hR = [-SHW - X, -0.5 + 0.04 * Math.abs(c), -0.2 * c];
    const hs = -Math.cos(PI * (b - 0.08));                                       // la cadera va un pelo antes que los brazos
    p.px = -0.07 * hs; p.hipRoll = 0.14 * hs; p.hipYaw = -0.12 * hs; p.roll = -0.05 * side;
    p.py = -0.05 * onBeat(b); p.lean = 0.05; p.nod = 0.06 * onBeat(b);
    p.fL = [0.13, 0, 0.02]; p.fR = [0.13, 0, 0.02];
    return p;
  },
  manos(b) {
    const p = base(), st = stepTouch(b, 0.14), d = onBeat(b);
    feetAbs(p, st.L, st.R, st.lL, st.lR); p.px = st.c;
    const swing = Math.sin(PI * (b - 0.5) / 2);
    p.roll = -0.24 * swing; p.hipRoll = 0.1 * swing; p.py = -0.06 * d; p.nod = -0.15 + 0.08 * d;
    p.hL = [0.06 - 0.12 * swing, 0.48 + 0.04 * d, 0.06 + 0.05 * Math.cos(PI * b / 2)]; p.hR = [0.06 + 0.12 * swing, 0.48 + 0.04 * d, 0.06 - 0.05 * Math.cos(PI * b / 2)];
    return p;
  },
  giro(b) {
    const T = b % 4; if (T < 1.5) return DANCE.basico(b);
    const p = DANCE.basico(b);
    if (T < 2) {                                                                  // anticipación: se tuerce al revés y baja
      const a = sstep(1.5, 2, T); p.yaw = -0.45 * a; p.py -= 0.08 * a; p.hL = lerp3(p.hL, [0.4, -0.1, 0.25], a); p.hR = lerp3(p.hR, [0.4, -0.1, 0.25], a); return p;
    }
    const q = (T - 2) / 2, e = backOut(clamp(q / 0.85, 0, 1)), j = Math.sin(PI * q), tuck = Math.sin(PI * clamp(q / 0.8, 0, 1));
