<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio de stickman</title>
<script>
/* ════════════════════════════════════════════════════════════════
   LABORATORIO DE STICKMAN — un esqueleto nuevo, más versátil que el de la pista de baile,
   solo para probar animaciones (todavía NO está en ningún overlay).

   Esqueleto: se ve de PERFIL (mira a la izquierda o a la derecha), el cuerpo puede rotar en
   cualquier ángulo (volteretas, trepar, colgarse) y manos/pies pueden ir a un punto exacto
   con IK de dos huesos (para pisar el piso o agarrarse de la pared sin patinar).
   Brazo y pierna del lado de atrás se dibujan más oscuros, detrás del cuerpo.

   Animaciones: quieto (respira y mira), caminar, correr, agacharse y saltar, volar/caer,
   aterrizar, rodar al caer fuerte, trepar los bordes de la pantalla, bajar deslizando,
   salto mortal desde la pared, paracaídas (se abre, se balancea, aterriza y se desinfla), saludar.
   Bailes (al mismo pulso): moonwalk, running man, guitarra al aire, robot, cumbia, disco, caporal.

   ENLACE: stickman-lab.html          → 3 stickmans haciendo cosas solos
     ?galeria=1  muestra todas las animaciones a la vez, cada una en su cuadro
     ?galeria=baile  solo los bailes · ?bpm=110 velocidad del baile
     ?n=5        cuántos stickmans
     ?panel=0    sin botones (los botones mandan al primero a hacer algo)
     ?fondo=1    fondo oscuro (para verlo en el navegador)
     ?piso=1880  altura del piso · ?escala=1 tamaño
   ════════════════════════════════════════════════════════════════ */
</script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body.fondo { background: linear-gradient(#36475a, #161c24); }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #cv { position: absolute; left: 0; top: 0; }
  #panel { position: absolute; left: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 1040px; z-index: 5; }
  #panel button { font: 700 26px system-ui, Arial; padding: 12px 18px; border-radius: 14px; border: 0; background: rgba(20,20,30,.75); color: #fff; cursor: pointer; }
  #panel button:hover { background: #e3122b; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas><div id="panel"></div></div>
<script>
const Q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; };
if (Q.get('fondo') === '1') document.body.classList.add('fondo');
const W = 1080, H = 1920, SC = num('escala', 1), FLOOR = num('piso', 1880);
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage');
cv.width = W; cv.height = H;
function fit() { stage.style.transform = `scale(${innerWidth / 1080})`; }
addEventListener('resize', fit); fit();

const TAU = Math.PI * 2, R = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
const backOut = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const rnd = (a, b) => a + R() * (b - a), pick = a => a[Math.floor(R() * a.length)];
const now = () => performance.now() / 1000;

/* ════════════════ ESQUELETO ════════════════
   Unidad u (px). Medidas: muslo 2,3u · canilla 2,3u · espalda 2,8u · brazo 1,6u + antebrazo 1,5u · cabeza 0,85u.
   La cadera es la raíz. Ángulos en radianes, 0 = hacia abajo, positivo = hacia ADELANTE (a donde mira).
     rot  inclinación de todo el cuerpo (+ adelante; 2π = una vuelta)      tor  curva extra de la espalda
     hd   cabeza                                                              rx, ry  mover la cadera (en u)
     a1 e1 / a2 e2   hombro y codo (1 = brazo de adelante, 2 = de atrás); codo + = dobla hacia adelante
     l1 k1 / l2 k2   cadera y rodilla; rodilla + = dobla hacia atrás (como una rodilla real)
   En vez de ángulos se puede pedir un punto: f1/f2 (pies) y h1/h2 (manos) = [x, y] en u desde la cadera.  */
const U = 20 * SC;
const TH = 2.3, SH = 2.3, TS = 2.8, UA = 1.6, FA = 1.5, HR = 0.85, LEG = TH + SH;
const KEYS = ['rx', 'ry', 'rot', 'tor', 'hd', 'a1', 'e1', 'a2', 'e2', 'l1', 'k1', 'l2', 'k2'];
const BASE = { rx: 0, ry: 0, rot: 0, tor: 0, hd: 0, a1: 0.15, e1: 0.25, a2: -0.12, e2: 0.2, l1: 0.06, k1: 0.06, l2: -0.06, k2: 0.04 };
const P = o => Object.assign({}, BASE, o);
const dirv = a => [Math.sin(a), Math.cos(a)];
function mixPose(A, B, t) { const o = {}; for (const k of KEYS) o[k] = A[k] + (B[k] - A[k]) * t;
  for (const k of ['f1', 'f2', 'h1', 'h2']) if (A[k] && B[k]) o[k] = [lerp(A[k][0], B[k][0], t), lerp(A[k][1], B[k][1], t)]; else if (t > 0.5 ? B[k] : A[k]) o[k] = t > 0.5 ? B[k] : A[k];
  o.prop = t > 0.5 ? B.prop : A.prop;
  return o; }
// IK de dos huesos: devuelve ángulo absoluto del primer hueso y doblez de la articulación
function ik(tx, ty, L1, L2, knee) {
  let d = Math.hypot(tx, ty); d = clamp(d, Math.abs(L1 - L2) + 1e-3, L1 + L2 - 1e-3);
  const a0 = Math.atan2(tx, ty), b = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  const g = Math.acos(clamp((L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2), -1, 1));
  return knee ? [a0 + b, Math.PI - g] : [a0 - b, Math.PI - g];      // rodilla: muslo adelante, codo: brazo atrás
}
// arma todos los puntos (en coordenadas locales mirando a la derecha, en u)
function skeleton(p) {
  const th = p.rot, ph = th + p.tor;
  const hip = [p.rx, p.ry], up = [Math.sin(ph), -Math.cos(ph)];
  const nk = [hip[0] + up[0] * TS, hip[1] + up[1] * TS];
  const ha = ph + p.hd, head = [nk[0] + Math.sin(ha) * (HR + 0.3), nk[1] - Math.cos(ha) * (HR + 0.3)];
  const sh = [hip[0] + up[0] * (TS - 0.25), hip[1] + up[1] * (TS - 0.25)];
  const arm = (a, e, h) => { let A1, A2;
    if (h) { const r = ik(h[0] - sh[0], h[1] - sh[1], UA, FA, false); A1 = r[0]; A2 = r[0] + r[1]; } else { A1 = a - ph; A2 = A1 + e; }
    const el = [sh[0] + Math.sin(A1) * UA, sh[1] + Math.cos(A1) * UA]; return [el, [el[0] + Math.sin(A2) * FA, el[1] + Math.cos(A2) * FA]]; };
  const leg = (l, k, f) => { let A1, A2;
    if (f) { const r = ik(f[0] - hip[0], f[1] - hip[1], TH, SH, true); A1 = r[0]; A2 = r[0] - r[1]; } else { A1 = l - th; A2 = A1 - k; }
    const kn = [hip[0] + Math.sin(A1) * TH, hip[1] + Math.cos(A1) * TH], an = [kn[0] + Math.sin(A2) * SH, kn[1] + Math.cos(A2) * SH];
    return [kn, an, [an[0] + Math.cos(A2) * 0.7, an[1] - Math.sin(A2) * 0.7]]; };     // pie hacia adelante
  return { hip, nk, head, ha, sh, arm1: arm(p.a1, p.e1, p.h1), arm2: arm(p.a2, p.e2, p.h2), leg1: leg(p.l1, p.k1, p.f1), leg2: leg(p.l2, p.k2, p.f2) };
}
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const r = (n >> 16) * k, g = ((n >> 8) & 255) * k, b = (n & 255) * k; return `rgb(${r | 0},${g | 0},${b | 0})`; }
// dibuja el stickman: x, y = cadera en el mundo, dir = 1 derecha / -1 izquierda
function drawStick(a, p) {
  const S = skeleton(p), wx = (pt) => a.x + a.dir * pt[0] * U, wy = (pt) => a.y + pt[1] * U;
  const line = (pts, col, w) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(wx(pts[0]), wy(pts[0])); for (let i = 1; i < pts.length; i++) ctx.lineTo(wx(pts[i]), wy(pts[i])); ctx.stroke(); };
  const OUT = '#14090d', ow = 0.62 * U, iw = 0.42 * U;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const back = shade(a.col, 0.62);
  const limb = (pts, col) => { line(pts, OUT, ow); line(pts, col, iw); };
  limb([S.sh, ...S.arm2], back); limb([S.hip, ...S.leg2], back);                     // lado de atrás
  if (a.chute) drawChuteLines(a, S);
  limb([S.hip, S.nk], a.col);
  if (p.prop === 'guitarra') drawGuitar(a, S, p); limb([S.hip, ...S.leg1], a.col);                          // cuerpo y lado de adelante
  // cabeza
  const hx = wx(S.head), hy = wy(S.head);
  ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(hx, hy, (HR + 0.11) * U, 0, TAU); ctx.fill();
  ctx.fillStyle = a.col; ctx.beginPath(); ctx.arc(hx, hy, HR * U, 0, TAU); ctx.fill();
  // cara de perfil: ojo y boca hacia donde mira (siguen la inclinación de la cabeza)
  const fa = S.ha, fw = [Math.cos(fa) * a.dir, Math.sin(fa)], upv = [Math.sin(fa) * a.dir, -Math.cos(fa)];
  const at = (f, u2) => [hx + (fw[0] * f + upv[0] * u2) * U, hy + (fw[1] * f + upv[1] * u2) * U];
  const eye = at(0.42, 0.2); ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(eye[0], eye[1], 0.13 * U, 0, TAU); ctx.fill();
  if (a.face === 'o') { const m = at(0.5, -0.32); ctx.beginPath(); ctx.arc(m[0], m[1], 0.15 * U, 0, TAU); ctx.fill(); }
  else { const m0 = at(0.12, -0.3), m1 = at(0.46, -0.36), m2 = at(0.62, -0.22); ctx.strokeStyle = OUT; ctx.lineWidth = 0.1 * U;
    ctx.beginPath(); ctx.moveTo(m0[0], m0[1]); ctx.quadraticCurveTo(m1[0], m1[1], m2[0], m2[1]); ctx.stroke(); }
  limb([S.sh, ...S.arm1], a.col);                                                        // brazo de adelante encima
  a.S = S;
  return S;
}

/* ── Guitarra (para el baile "guitarra al aire"): caja a la altura de la cadera, mástil hacia la mano de atrás ── */
function drawGuitar(a, S, p) {
  const wx = pt => a.x + a.dir * pt[0] * U, wy = pt => a.y + pt[1] * U;
  const body = [p.rx + 0.75, p.ry - 0.55], hand = S.arm2[1];
  const bx = wx(body), by = wy(body), hx = wx(hand), hy = wy(hand), ang = Math.atan2(hy - by, hx - bx);
  ctx.save(); ctx.translate(bx, by); ctx.rotate(ang);
  const L = Math.hypot(hx - bx, hy - by) + 0.5 * U;
  ctx.fillStyle = '#14090d'; ctx.fillRect(0, -0.22 * U, L + 0.1 * U, 0.44 * U);
  ctx.fillStyle = '#c9a36b'; ctx.fillRect(0, -0.12 * U, L, 0.24 * U);
  ctx.fillStyle = '#14090d'; ctx.fillRect(L - 0.2 * U, -0.32 * U, 0.6 * U, 0.64 * U);
  for (const [cx, r] of [[-0.55, 1.05], [0.55, 0.8]]) { ctx.beginPath(); ctx.arc(cx * U, 0, (r + 0.12) * U, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#e3122b'; for (const [cx, r] of [[-0.55, 1.05], [0.55, 0.8]]) { ctx.beginPath(); ctx.arc(cx * U, 0, r * U, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#14090d'; ctx.beginPath(); ctx.arc(0.1 * U, 0, 0.32 * U, 0, TAU); ctx.fill();
  ctx.restore();
}
/* ── Paracaídas ── */
function canopyPos(a) {                     // centro de la tela, arriba de la cadera (se mueve menos que el cuerpo)
  const c = a.chute, sw = c.sway * 0.45, L = 7.2 * c.s + 2.6;
  return [a.x + Math.sin(sw) * L * U * a.dir, a.y - Math.cos(sw) * L * U];
}
function drawChuteLines(a, S) {
  const c = a.chute; if (c.s < 0.05) return;
  const [cx, cy] = canopyPos(a), w = 4.2 * U * c.s, sw = c.sway * 0.45 * a.dir;
  const edge = s => [cx + Math.cos(sw) * w * s, cy + Math.sin(sw) * w * s + 0.4 * U * c.s];
  const sx = a.x + a.dir * S.sh[0] * U, sy = a.y + S.sh[1] * U;
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 0.09 * U;
  ctx.beginPath(); for (const s of [-1, -0.45, 0.45, 1]) { const e = edge(s); ctx.moveTo(e[0], e[1]); ctx.lineTo(sx, sy); } ctx.stroke();
}
function drawCanopy(cx, cy, s, ang, hue, alpha, crumple) {
  if (s < 0.03) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy); ctx.rotate(ang);
  const w = 4.2 * U * s, h = 2.6 * U * s * (1 - 0.7 * (crumple || 0));
  const cols = [`hsl(${hue},85%,55%)`, '#f4f4f4'];
  for (let i = 0; i < 6; i++) { const a0 = Math.PI + i * Math.PI / 6, a1 = a0 + Math.PI / 6;
    ctx.fillStyle = cols[i % 2]; ctx.beginPath(); ctx.moveTo(0, 0.4 * U * s);
    ctx.ellipse(0, 0.4 * U * s, w, h, 0, a0, a1); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle = '#14090d'; ctx.lineWidth = 0.16 * U; ctx.beginPath(); ctx.ellipse(0, 0.4 * U * s, w, h, 0, Math.PI, TAU);
  // borde de abajo ondulado
  for (let i = 0; i <= 6; i++) { const x = w - (i / 6) * 2 * w; ctx.quadraticCurveTo(x + w / 6, 0.4 * U * s + 0.5 * U * s, x, 0.4 * U * s); }
  ctx.stroke(); ctx.restore();
}

/* ════════════════ ANIMACIONES (pose según el tiempo) ════════════════ */
const ANIM = {
  quieto(t, a) { const b = Math.sin(t * 2.4), look = Math.sin(t * 0.7 + a.seed) > 0.7 ? 0.35 : 0;
    return P({ ry: 0.05 * b, tor: 0.03 * b, hd: -0.08 + look * Math.sin(t * 3), a1: 0.12 + 0.04 * b, a2: -0.12 - 0.04 * b, f1: [0.55, LEG + 0.05 * b], f2: [-0.45, LEG + 0.05 * b] }); },
  caminar(ph) { const s = Math.sin(ph * TAU), c = Math.cos(ph * TAU);
    return P({ ry: 0.12 - 0.12 * Math.abs(c), rot: 0.06, hd: 0.04 * s,
      l1: 0.5 * s, k1: 0.12 + 0.95 * Math.max(0, Math.sin(ph * TAU + 2.2)), l2: -0.5 * s, k2: 0.12 + 0.95 * Math.max(0, Math.sin(ph * TAU + 2.2 + Math.PI)),
      a1: -0.45 * s, e1: 0.35 + 0.2 * Math.max(0, -s), a2: 0.45 * s, e2: 0.35 + 0.2 * Math.max(0, s) }); },
  correr(ph) { const s = Math.sin(ph * TAU), c = Math.cos(ph * TAU);
    return P({ ry: 0.35 - 0.45 * Math.abs(c), rot: 0.32, hd: -0.25, tor: 0.05,
      l1: 0.15 + 0.85 * s, k1: 0.3 + 1.5 * Math.max(0, Math.sin(ph * TAU + 1.9)), l2: 0.15 - 0.85 * s, k2: 0.3 + 1.5 * Math.max(0, Math.sin(ph * TAU + 1.9 + Math.PI)),
      a1: -0.9 * s, e1: 1.5, a2: 0.9 * s, e2: 1.5 }); },
  agachado(q) { const d = 1.6 * q;                                                       // antes de saltar / al aterrizar
    return P({ ry: d, rot: 0.35 * q, hd: -0.3 * q, a1: lerp(0.15, -0.9, q), e1: 0.4, a2: lerp(-0.12, -1.1, q), e2: 0.4, f1: [0.7, LEG], f2: [-0.4, LEG] }); },
  aire(vy, t) { const up = clamp(-vy / 900, -1, 1);                                     // subiendo: estirado · cayendo: brazos arriba agitándose
    if (up > 0) return P({ rot: 0.1, a1: lerp(1.2, 2.9, up), e1: 0.2, a2: lerp(1.0, 2.7, up), e2: 0.2, l1: 0.35, k1: 0.9 * (1 - up) + 0.2, l2: -0.2, k2: 0.6 });
    const f = Math.sin(t * 22);
    return P({ rot: -0.1, hd: -0.2, a1: 2.5 + 0.35 * f, e1: 0.5, a2: 2.3 - 0.35 * f, e2: 0.5, l1: 0.4 + 0.25 * f, k1: 0.7, l2: -0.3 - 0.25 * f, k2: 0.5 }); },
  bolita(q) { return P({ rot: q * TAU, tor: 0.5, hd: 0.4, a1: 0.9, e1: 2.2, a2: 0.7, e2: 2.2, l1: 1.9, k1: 2.5, l2: 1.7, k2: 2.4 }); },
  // trepar: mira a la pared, manos y pies se agarran por turnos
  trepar(ph) { const A = ph % 1 < 0.5, k = Math.sin((ph % 0.5) * 2 * Math.PI);
    const hiY = -5.6, loY = -3.2, wallX = 1.75;
    return P({ rot: -0.05, hd: -0.35,
      h1: [wallX, A ? lerp(loY, hiY, (ph % 0.5) * 2) - 0.6 * k : lerp(hiY, loY, (ph % 0.5) * 2)], h2: [wallX - 0.05, A ? lerp(hiY, loY, (ph % 0.5) * 2) : lerp(loY, hiY, (ph % 0.5) * 2) - 0.6 * k],
      f1: [wallX + 0.05, A ? lerp(2.6, 1.2, (ph % 0.5) * 2) : lerp(1.2, 2.6, (ph % 0.5) * 2) - 0.5 * k], f2: [wallX, A ? lerp(1.2, 2.6, (ph % 0.5) * 2) - 0.5 * k : lerp(2.6, 1.2, (ph % 0.5) * 2)] }); },
  deslizar(t) { const j = Math.sin(t * 40) * 0.05;
    return P({ rot: -0.25, hd: 0.3, h1: [1.75, -4.4 + j], h2: [1.7, -4.2 - j], f1: [1.85, 2.3], f2: [1.7, 3.2], tor: -0.1 }); },
  pegado(q) { return P({ rot: lerp(-0.05, 0.25, q), hd: 0.2, h1: [1.75, -4.8 + 1.2 * q], h2: [1.7, -4.4 + 1.2 * q], f1: [1.8, 1.4 + 0.3 * q], f2: [1.7, 1.9 + 0.3 * q] }); },
  paracaidas(t, a) { const k = Math.sin(t * 3.1 + a.seed);
    return P({ rot: a.chute.sway, hd: -0.15, a1: 2.75, e1: 0.25, a2: 2.6, e2: 0.25, l1: 0.15 + 0.25 * k, k1: 0.35 + 0.2 * k, l2: -0.05 - 0.25 * k, k2: 0.3 - 0.15 * k }); },
  saludar(t) { const w = Math.sin(t * 11);
    return P({ hd: 0.15, rot: -0.05, a1: 2.55, e1: 0.6 + 0.55 * w, a2: -0.1, e2: 0.3, f1: [0.55, LEG], f2: [-0.45, LEG] }); },
  festejar(t) { const j = Math.max(0, Math.sin(t * 9));
    return P({ ry: -1.2 * j, hd: -0.3, a1: 2.8 + 0.2 * Math.sin(t * 18), e1: 0.1, a2: 2.7 - 0.2 * Math.sin(t * 18), e2: 0.1, l1: 0.3 * j, k1: 0.6 * j, l2: -0.2 * j, k2: 0.9 * j }); },
};

/* ════════════════ BAILES (pose según el TIEMPO MUSICAL: b = beats) ════════════════
   Todos van al mismo pulso (?bpm=110), así varios stickmans bailando quedan sincronizados. */
const BPM = num('bpm', 110), BPS = BPM / 60;
const DANCES = ['moonwalk', 'runningman', 'guitarra', 'robot', 'cumbia', 'disco', 'caporal'];
const DNAME = { moonwalk: 'Moonwalk', runningman: 'Running man', guitarra: 'Guitarra al aire', robot: 'Robot', cumbia: 'Cumbia', disco: 'Disco', caporal: 'Caporal' };
const ROBOT = [
  P({ a1: 0, e1: 1.57, a2: 0, e2: 1.57, hd: 0, f1: [0.5, LEG], f2: [-0.4, LEG] }),
  P({ a1: 1.57, e1: 1.5, a2: 0, e2: 1.57, hd: 0.35, f1: [0.5, LEG], f2: [-0.4, LEG] }),
  P({ a1: 0, e1: 1.57, a2: 1.57, e2: 1.5, hd: -0.35, rot: 0.12, f1: [0.5, LEG], f2: [-0.4, LEG] }),
  P({ a1: 1.57, e1: 0, a2: 1.57, e2: 0, ry: 0.55, rot: 0.05, hd: 0.15, f1: [0.5, LEG], f2: [-0.4, LEG] }),
];
const DANCE = {
  // se desliza hacia atrás: un pie plano resbala atrás mientras el otro queda en punta, y cambian en cada beat
  moonwalk(b) { const k = Math.floor(b) % 2, s = b % 1, rise = sstep(0, 0.2, s);
    const flat = [0.35 - s, LEG - 0.35 * (1 - rise)], toe = [-0.65 + s, LEG - 0.35 * rise];
    const w = Math.sin(b * Math.PI);
    return P({ ry: 0.12, rot: 0.06, hd: 0.08 * w, a1: 0.15 + 0.18 * w, e1: 0.7, a2: 0.1 - 0.18 * w, e2: 0.7, f1: k ? toe : flat, f2: k ? flat : toe }); },
  // una rodilla sube mientras el otro pie resbala atrás, alternando

    const b = document.createElement('button'); b.textContent = txt; b.onclick = () => go(actors[0], k); pn.appendChild(b); });
  const all = document.createElement('button'); all.textContent = '¡Todos a bailar!';
  all.onclick = () => { const d = pick(DANCES); actors.forEach(a => go(a, 'bailar:' + d)); }; pn.appendChild(all);
}
function go(a, k) { if (['quieto', 'caminar', 'correr', 'saludar', 'festejar', 'bailar'].includes(a.st)) order(a, k); else a.queue = [k];
}
window.__lab = { actors, order, set, DANCES };
</script>
